<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 176" width="160" height="176" role="img" aria-label="1S LiPo flat pouch cell with protection board and JST connector">
  <title>1S LiPo pouch cell with JST lead (CC0)</title>
  <rect x="30" y="64" width="100" height="92" rx="6" fill="#e3e8ec" stroke="#78909c" stroke-width="1.5"/>
  <rect x="30" y="64" width="100" height="14" rx="6" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
  <rect x="44" y="92" width="72" height="50" rx="4" fill="#ffffff" stroke="#b0bec5"/>
  <text x="80" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#37474f">LiPo 1S</text>
  <text x="80" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#37474f">3.7V</text>
  <text x="80" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#c62828">no puncture</text>
  <rect x="54" y="48" width="52" height="18" rx="2" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
  <rect x="60" y="53" width="10" height="8" fill="#c9a227"/>
  <rect x="78" y="53" width="20" height="8" fill="#37474f"/>
  <path d="M93 48 V24" fill="none" stroke="#c62828" stroke-width="2"/>
  <path d="M67 48 V24" fill="none" stroke="#212121" stroke-width="2"/>
  <rect x="56" y="8" width="50" height="16" rx="2" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1.5"/>
  <rect id="term-plus" x="87" y="11" width="12" height="10" rx="1" fill="#c62828" stroke="#8e0000" stroke-width="1"/>
  <rect id="term-minus" x="61" y="11" width="12" height="10" rx="1" fill="#212121" stroke="#000" stroke-width="1"/>
  <text x="93" y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#c62828">+</text>
  <text x="67" y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#212121">&#8722;</text>
  <text x="80" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#546e7a">check JST polarity</text>
</svg>
