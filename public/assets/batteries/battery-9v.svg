<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" width="160" height="150" role="img" aria-label="9V battery with both terminals on top">
  <title>9V battery (CC0)</title>
  <rect x="44" y="34" width="72" height="96" rx="6" fill="#2f3438" stroke="#1b1f22" stroke-width="1.5"/>
  <rect x="50" y="42" width="60" height="80" rx="3" fill="#3d4449"/>
  <text x="80" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#f5f5f5">9V</text>
  <rect x="52" y="48" width="56" height="10" rx="1" fill="#c9a227"/>
  <circle id="term-minus" cx="62" cy="22" r="7" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="1.5"/>
  <circle cx="62" cy="22" r="3.2" fill="#2a2a2a"/>
  <text x="62" y="12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#212121"></text>
  <rect id="term-plus" x="90" y="14" width="16" height="16" rx="2" fill="#c62828" stroke="#8e0000" stroke-width="1.5"/>
  <rect x="94" y="18" width="8" height="8" rx="1" fill="#ef5350"/>
  <text x="98" y="12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#c62828">+</text>
  <text x="80" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#546e7a">both snaps on top</text>
</svg>
