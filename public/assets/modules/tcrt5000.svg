<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 280" width="160" height="280" role="img" aria-label="TCRT5000 IR line sensor module top view (original simplified drawing, CC0)">
  <title>TCRT5000 IR line sensor module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Blue board: TCRT5000 (IR LED and phototransistor side by side) on the end, LM393, trimmer, two LEDs.
    Header left to right: VCC, GND, DO, AO (some boards print AO, DO, GND, VCC).
  -->
