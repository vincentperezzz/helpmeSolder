<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 352" width="220" height="352" role="img" aria-label="TFT ST7735 1.8 inch (SPI), front view">
  <title>TFT ST7735 1.8 inch (SPI), front view</title>
  <!--
    1.8 inch ST7735 TFT breakout on a red board, front view, about 6 units per mm. The microSD slot is on the back and not drawn.
    8-pin header on one short edge. The printed order varies by seller; drawn here left to right VCC, GND, CS, RESET, A0 (DC), SDA (MOSI), SCK, LED (backlight), matching the catalog order. Check your own silkscreen.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="8" y="8" width="204" height="336" rx="6" fill="#b71c1c" stroke="#7f0000" stroke-width="2"/>
  <circle cx="20" cy="20" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="200" cy="20" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <rect x="46.5" y="23" width="127" height="18" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="57.5" cy="32" r="5"/>
  <text class="pinlbl" x="57.5" y="46" transform="rotate(90 57.5 46)" text-anchor="start" dy="3" font-size="7.5">VCC</text>
  <circle class="hole gnd" cx="72.5" cy="32" r="5"/>
  <text class="pinlbl" x="72.5" y="46" transform="rotate(90 72.5 46)" text-anchor="start" dy="3" font-size="7.5">GND</text>
  <circle class="hole" cx="87.5" cy="32" r="5"/>
  <text class="pinlbl" x="87.5" y="46" transform="rotate(90 87.5 46)" text-anchor="start" dy="3" font-size="7.5">CS</text>
  <circle class="hole" cx="102.5" cy="32" r="5"/>
  <text class="pinlbl" x="102.5" y="46" transform="rotate(90 102.5 46)" text-anchor="start" dy="3" font-size="7.5">RESET</text>
  <circle class="hole" cx="117.5" cy="32" r="5"/>
  <text class="pinlbl" x="117.5" y="46" transform="rotate(90 117.5 46)" text-anchor="start" dy="3" font-size="7.5">A0</text>
  <circle class="hole" cx="132.5" cy="32" r="5"/>
  <text class="pinlbl" x="132.5" y="46" transform="rotate(90 132.5 46)" text-anchor="start" dy="3" font-size="7.5">SDA</text>
  <circle class="hole" cx="147.5" cy="32" r="5"/>
  <text class="pinlbl" x="147.5" y="46" transform="rotate(90 147.5 46)" text-anchor="start" dy="3" font-size="7.5">SCK</text>
  <circle class="hole" cx="162.5" cy="32" r="5"/>
  <text class="pinlbl" x="162.5" y="46" transform="rotate(90 162.5 46)" text-anchor="start" dy="3" font-size="7.5">LED</text>
  <rect x="14" y="82" width="192" height="254" rx="3" fill="#0d0d10" stroke="#000" stroke-width="1.5"/>
  <rect x="28" y="104" width="164" height="206" fill="#0a1626" stroke="#1d2a3d" stroke-width="1"/>
  <polygon points="28,310 110,104 146.1,104 64.1,310" fill="#fff" opacity="0.07"/>
  <polygon points="77.2,310 151,104 162.5,104 88.7,310" fill="#fff" opacity="0.05"/>
  <text class="label" x="110" y="332" text-anchor="middle" font-size="7" style="fill:#9aa3b2" opacity="1">1.8 TFT 128x160</text>
</svg>
