  <rect class="smd" x="54" y="402" width="8" height="5" rx="0.8"/>
  <rect x="249" y="399" width="16" height="14" rx="1.5" fill="#222" stroke="#000"/>
  <rect class="smd" x="271" y="402" width="8" height="5" rx="0.8"/>
  <rect class="smd" x="281" y="402" width="5" height="8" rx="0.8"/>
  <rect x="144.5" y="400" width="7" height="7" rx="1" fill="#444"/>
  <rect x="96.5" y="452" width="120" height="18" rx="2" fill="#1b1b1b"/>
