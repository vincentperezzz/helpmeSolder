  <text class="pinlbl" x="135.5" y="447" transform="rotate(-90 135.5 447)" text-anchor="end" dy="3" font-size="7.5">DIN</text>
  <circle class="hole" cx="149.5" cy="461" r="5"/>
  <text class="pinlbl" x="149.5" y="447" transform="rotate(-90 149.5 447)" text-anchor="end" dy="3" font-size="7.5">CLK</text>
  <circle class="hole" cx="163.5" cy="461" r="5"/>
  <text class="pinlbl" x="163.5" y="447" transform="rotate(-90 163.5 447)" text-anchor="end" dy="3" font-size="7.5">CS</text>
  <circle class="hole" cx="177.5" cy="461" r="5"/>
  <text class="pinlbl" x="177.5" y="447" transform="rotate(-90 177.5 447)" text-anchor="end" dy="3" font-size="7.5">DC</text>
  <circle class="hole" cx="191.5" cy="461" r="5"/>
  <text class="pinlbl" x="191.5" y="447" transform="rotate(-90 191.5 447)" text-anchor="end" dy="3" font-size="7.5">RST</text>
  <circle class="hole" cx="205.5" cy="461" r="5"/>
  <text class="pinlbl" x="205.5" y="447" transform="rotate(-90 205.5 447)" text-anchor="end" dy="3" font-size="7.5">BUSY</text>
</svg>
