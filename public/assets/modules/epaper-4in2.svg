<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 313 486" width="313" height="486" role="img" aria-label="E-paper 4.2 inch 400x300 (SPI), front view">
  <title>E-paper 4.2 inch 400x300 (SPI), front view</title>
  <!--
    4.2 inch e-paper panel (400x300) drawn portrait, with the amber flexible tail running to a small adapter board.
    Adapter board: FPC connector, DC/DC inductor and passives, 8-pin header along the bottom edge in the usual order VCC, GND, DIN, CLK, CS, DC, RST, BUSY.
    On the real module the tail folds the board behind the panel; it is shown below it so the header is visible.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="69" y="346" width="176" height="48" fill="#d9962b" stroke="#a86d12" stroke-width="1"/>
  <rect x="75" y="370" width="11.3" height="16" fill="#f2c75c"/>
  <rect x="95.5" y="370" width="11.3" height="16" fill="#f2c75c"/>
  <rect x="116" y="370" width="11.3" height="16" fill="#f2c75c"/>
  <rect x="136.5" y="370" width="11.3" height="16" fill="#f2c75c"/>
  <rect x="157" y="370" width="11.3" height="16" fill="#f2c75c"/>
  <rect x="177.5" y="370" width="11.3" height="16" fill="#f2c75c"/>
  <rect x="198" y="370" width="11.3" height="16" fill="#f2c75c"/>
  <rect x="218.5" y="370" width="11.3" height="16" fill="#f2c75c"/>
  <rect x="10" y="10" width="293" height="346" rx="3" fill="#e9e7df" stroke="#a7a498" stroke-width="1.5"/>
  <rect x="32" y="18" width="248" height="328" fill="#cfccc2"/>
  <rect x="35" y="21" width="242" height="322" fill="#f4f3ee" stroke="#3a3a37" stroke-width="1"/>
  <rect x="49" y="91.8" width="181.9" height="14.5" fill="#6d6d68" opacity="0.55"/>
  <rect x="49" y="149.8" width="132.7" height="14.5" fill="#6d6d68" opacity="0.55"/>
  <rect x="49" y="207.8" width="181.9" height="14.5" fill="#6d6d68" opacity="0.55"/>
  <circle cx="251" cy="45" r="9" fill="#2a2a28" opacity="0.7"/>
  <text class="label" x="156.5" y="348" text-anchor="middle" font-size="6.5" style="fill:#6e6b60" opacity="1">4.2 inch e-Paper</text>
  <rect x="10" y="372" width="293" height="104" rx="4" fill="#1565c0" stroke="#0b3d82" stroke-width="2"/>
  <circle cx="21" cy="384" r="3" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
