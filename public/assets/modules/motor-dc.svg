<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 160" width="270" height="160" role="img" aria-label="DC hobby motor top view (original simplified drawing, CC0)">
  <title>DC hobby motor top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Silver 130-size can, black rear cap with two solder tabs and a wire soldered to each; shaft on the right.
    Terminals are the two wire tips (M1 top, M2 bottom). The motor has no polarity.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect class="metal" x="214" y="74" width="46" height="12" rx="2"/>
  <rect x="196" y="60" width="20" height="40" rx="3" fill="#90a4ae" stroke="#546e7a"/>
  <rect x="62" y="30" width="136" height="100" rx="12" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <rect x="62" y="36" width="136" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
  <rect x="62" y="114" width="136" height="12" rx="6" fill="#78909c" opacity="0.35"/>
  <path d="M150 30 V130 M154 30 V130" stroke="#90a4ae" stroke-width="1"/>
  <text x="106" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#263238">RF-130</text>
  <text x="106" y="92" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#37474f">3-6V DC</text>
  <rect x="44" y="40" width="20" height="80" rx="5" fill="#263238" stroke="#000"/>
  <rect class="metal" x="30" y="56" width="18" height="7" rx="1"/>
  <rect class="metal" x="30" y="97" width="18" height="7" rx="1"/>
  <path d="M34 60 C22 60 24 40 8 40" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M34 60 C22 60 24 40 8 40" fill="none" stroke="#d32f2f" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="8" cy="40" r="3.6" fill="#e0e0e0" stroke="#607d8b" stroke-width="1"/>
  <path d="M34 100 C22 100 24 120 8 120" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M34 100 C22 100 24 120 8 120" fill="none" stroke="#212121" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="8" cy="120" r="3.6" fill="#e0e0e0" stroke="#607d8b" stroke-width="1"/>
</svg>
