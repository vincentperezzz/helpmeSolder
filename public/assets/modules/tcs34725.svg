<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 196" width="178" height="196" role="img" aria-label="TCS34725 colour sensor board top view (original simplified drawing, CC0)">
  <title>TCS34725 colour sensor board top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Square board: sensor chip with window in the middle, white LED on each side, 3.3 V regulator.
    Header left to right: VIN, 3V3, GND, SDA, SCL, INT, LED. Board colour varies (black or purple).
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="16" y="14" width="146" height="168" rx="5" fill="#1c1c1c" stroke="#424242" stroke-width="2"/>
  <circle cx="35" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole pwr" cx="35" cy="34" r="5"/>
  <text class="pinlbl" x="35" y="48" transform="rotate(90 35 48)" text-anchor="start" dy="2.7" font-size="7.5">VIN</text>
  <circle cx="53" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole v3" cx="53" cy="34" r="5"/>
  <text class="pinlbl" x="53" y="48" transform="rotate(90 53 48)" text-anchor="start" dy="2.7" font-size="7.5">3V3</text>
  <circle cx="71" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole gnd" cx="71" cy="34" r="5"/>
  <text class="pinlbl" x="71" y="48" transform="rotate(90 71 48)" text-anchor="start" dy="2.7" font-size="7.5">GND</text>
  <circle cx="89" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="89" cy="34" r="5"/>
  <text class="pinlbl" x="89" y="48" transform="rotate(90 89 48)" text-anchor="start" dy="2.7" font-size="7.5">SDA</text>
  <circle cx="107" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="107" cy="34" r="5"/>
  <text class="pinlbl" x="107" y="48" transform="rotate(90 107 48)" text-anchor="start" dy="2.7" font-size="7.5">SCL</text>
  <circle cx="125" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="125" cy="34" r="5"/>
  <text class="pinlbl" x="125" y="48" transform="rotate(90 125 48)" text-anchor="start" dy="2.7" font-size="7.5">INT</text>
  <circle cx="143" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="143" cy="34" r="5"/>
  <text class="pinlbl" x="143" y="48" transform="rotate(90 143 48)" text-anchor="start" dy="2.7" font-size="7.5">LED</text>
  <rect x="30" y="108" width="24" height="16" rx="2" fill="#fffde7" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="36" y="112" width="12" height="8" rx="1" fill="#ffe082" stroke="#f9a825" stroke-width="0.6"/>
  <rect x="124" y="108" width="24" height="16" rx="2" fill="#fffde7" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="130" y="112" width="12" height="8" rx="1" fill="#ffe082" stroke="#f9a825" stroke-width="0.6"/>
  <rect x="72" y="108" width="34" height="20" rx="2" fill="#0d0d0d" stroke="#555" stroke-width="1"/>
  <rect x="80" y="112" width="18" height="12" rx="1" fill="#455a64" stroke="#78909c" stroke-width="0.6"/>
  <rect x="40" y="146" width="12" height="8" rx="1" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
  <rect x="41" y="154" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="45" y="154" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="49" y="154" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="42" y="143" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="48" y="143" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="64" y="146" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <rect x="76" y="146" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <rect x="90" y="146" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <rect x="106" y="146" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <rect x="122" y="146" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <text class="label" x="89" y="172" text-anchor="middle" font-size="7">TCS34725</text>
</svg>
