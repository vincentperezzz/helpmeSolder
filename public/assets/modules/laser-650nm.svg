<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 215" width="175" height="215" role="img" aria-label="650 nm laser module top view (original simplified drawing, CC0)">
  <title>650 nm laser module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Brass laser barrel on a small green board with a 3-pin header along the bottom edge: S (signal), middle pin (+5V, unlabelled on the board) and - (GND).
    KY-008 style board; the middle pin is unlabelled on the real silkscreen.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="64" y="12" width="46" height="130" rx="6" fill="#c9a24a" stroke="#8a6a1e" stroke-width="2"/>
  <rect x="68" y="16" width="8" height="122" fill="#fff" opacity="0.35"/>
  <path d="M64 56 H110 M64 60 H110" stroke="#8a6a1e" stroke-width="1"/>
  <circle cx="87" cy="22" r="14" fill="#263238" stroke="#8a6a1e" stroke-width="2"/>
  <circle cx="87" cy="22" r="8" fill="#e53935" opacity="0.85"/>
  <rect x="12" y="100" width="150" height="104" rx="4" fill="#2e7d32" stroke="#1b4d20" stroke-width="2"/>
  <rect x="60" y="100" width="54" height="46" fill="#c9a24a" stroke="#8a6a1e" stroke-width="2"/>
  <rect x="64" y="104" width="8" height="38" fill="#fff" opacity="0.35"/>
  <rect class="smd" x="120" y="116" width="10" height="6" rx="1"/>
  <rect class="smd" x="120" y="128" width="10" height="6" rx="1"/>
  <text class="label" x="30" y="122" font-size="7">650nm</text>
  <text class="label" x="30" y="132" font-size="6">5mW</text>
  <rect x="51" y="177" width="72" height="18" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="62" cy="186" r="6"/>
  <text class="label" x="62" y="174" text-anchor="middle" font-size="9">S</text>
  <circle class="hole pwr" cx="87" cy="186" r="6"/>
  <circle class="hole gnd" style="stroke:#9e9e9e" cx="112" cy="186" r="6"/>
  <text class="label" x="112" y="174" text-anchor="middle" font-size="9">-</text>
</svg>
