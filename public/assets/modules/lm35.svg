<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 270" width="180" height="270" role="img" aria-label="LM35 TO-92 temperature sensor front view (original simplified drawing, CC0)">
  <title>LM35 TO-92 temperature sensor front view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    TO-92 package seen from the flat face with the legs down: +Vs, Vout, GND from the left.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="59.5" y="120" width="7" height="114" rx="2" fill="#cfd8dc" stroke="#78909c" stroke-width="0.8"/>
  <rect x="86.5" y="120" width="7" height="114" rx="2" fill="#cfd8dc" stroke="#78909c" stroke-width="0.8"/>
  <rect x="113.5" y="120" width="7" height="114" rx="2" fill="#cfd8dc" stroke="#78909c" stroke-width="0.8"/>
  <path d="M45 124 V69 A45 45 0 0 1 135 69 V124 Z" fill="#232323" stroke="#000" stroke-width="1.5"/>
  <path d="M52 74 A38 38 0 0 1 78 36" fill="none" stroke="#ffffff30" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="90" y="76" text-anchor="middle" font-size="12" font-weight="bold">LM35</text>
  <text class="label" x="90" y="91" text-anchor="middle" font-size="12">DZ</text>
  <text class="label" x="63" y="254" text-anchor="middle" font-size="9" style="fill:#78909c">+Vs</text>
