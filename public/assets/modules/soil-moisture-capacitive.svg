<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170.5 585" width="170.5" height="585" role="img" aria-label="Capacitive soil moisture sensor v1.2 top view (original drawing, CC0)">
  <title>Capacitive soil moisture sensor v1.2 top view (original drawing, CC0)</title>
  <!--
    Original CC0 top view for HelpmeSolder wiring diagrams.
    98 x 23 mm board: 3-pin JST connector at the top (GND, VCC, AOUT as printed), TLC555 timer and 3.3 V regulator below it,
    notches on both edges marking the maximum insertion depth, and the white sensing area down to the pointed tip.
    The v1.2 board has no digital output: the catalog DO pin shares the AOUT pad. Silk colour and electrode pattern are simplified.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
