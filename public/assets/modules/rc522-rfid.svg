  <rect x="42" y="126" width="116" height="128" rx="8" fill="none" stroke="#c9d8f2" stroke-width="2.2"/>
  <rect x="48" y="132" width="104" height="116" rx="6" fill="none" stroke="#c9d8f2" stroke-width="2.2"/>
  <rect x="54" y="138" width="92" height="104" rx="4" fill="none" stroke="#c9d8f2" stroke-width="2.2"/>
  <circle cx="100" cy="190" r="4" fill="#eceff1"/>
  <path d="M 109.8 180.2 A 14 14 0 0 1 109.8 199.8" fill="none" stroke="#eceff1" stroke-width="2"/>
  <path d="M 116.8 173.2 A 24 24 0 0 1 116.8 206.8" fill="none" stroke="#eceff1" stroke-width="2"/>
  <path d="M 123.8 166.2 A 34 34 0 0 1 123.8 213.8" fill="none" stroke="#eceff1" stroke-width="2"/>
  <path d="M 130.8 159.2 A 44 44 0 0 1 130.8 220.8" fill="none" stroke="#eceff1" stroke-width="2"/>
  <path d="M 90.2 180.2 A 14 14 0 0 0 90.2 199.8" fill="none" stroke="#eceff1" stroke-width="2"/>
  <path d="M 83.2 173.2 A 24 24 0 0 0 83.2 206.8" fill="none" stroke="#eceff1" stroke-width="2"/>
  <path d="M 76.2 166.2 A 34 34 0 0 0 76.2 213.8" fill="none" stroke="#eceff1" stroke-width="2"/>
  <path d="M 69.2 159.2 A 44 44 0 0 0 69.2 220.8" fill="none" stroke="#eceff1" stroke-width="2"/>
  <text class="label" x="100" y="252" text-anchor="middle" font-size="11" font-weight="bold">RFID-RC522</text>
</svg>
