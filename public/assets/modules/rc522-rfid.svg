  <rect class="smd" x="70" y="104" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="80" y="104" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="90" y="104" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="100" y="104" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="110" y="104" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="120" y="104" width="6" height="4" rx="0.6"/>
