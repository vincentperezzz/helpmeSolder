<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300" role="img" aria-label="RC522 RFID reader top view (original simplified drawing, CC0)">
  <title>RC522 RFID reader top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Common blue MFRC522 board: 8-pin header on the short edge, printed antenna coil.
    Header left to right: SDA (SPI chip select), SCK, MOSI, MISO, IRQ, GND, RST, 3.3V.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="20" y="22" width="160" height="262" rx="6" fill="#1f56b0" stroke="#143c80" stroke-width="2"/>
  <circle cx="32" cy="104" r="5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="168" cy="104" r="5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="32" cy="272" r="5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="168" cy="272" r="5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <rect x="26" y="31" width="148" height="18" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="37" cy="40" r="6"/>
  <text class="pinlbl" x="37" y="54" transform="rotate(90 37 54)" font-size="7.5">SDA</text>
  <circle class="hole" cx="55" cy="40" r="6"/>
  <text class="pinlbl" x="55" y="54" transform="rotate(90 55 54)" font-size="7.5">SCK</text>
  <circle class="hole" cx="73" cy="40" r="6"/>
  <text class="pinlbl" x="73" y="54" transform="rotate(90 73 54)" font-size="7.5">MOSI</text>
  <circle class="hole" cx="91" cy="40" r="6"/>
  <text class="pinlbl" x="91" y="54" transform="rotate(90 91 54)" font-size="7.5">MISO</text>
  <circle class="hole" cx="109" cy="40" r="6"/>
  <text class="pinlbl" x="109" y="54" transform="rotate(90 109 54)" font-size="7.5">IRQ</text>
  <circle class="hole gnd" cx="127" cy="40" r="6"/>
  <text class="pinlbl" x="127" y="54" transform="rotate(90 127 54)" font-size="7.5">GND</text>
  <circle class="hole" cx="145" cy="40" r="6"/>
  <text class="pinlbl" x="145" y="54" transform="rotate(90 145 54)" font-size="7.5">RST</text>
  <circle class="hole v3" cx="163" cy="40" r="6"/>
  <text class="pinlbl" x="163" y="54" transform="rotate(90 163 54)" font-size="7.5">3.3V</text>
