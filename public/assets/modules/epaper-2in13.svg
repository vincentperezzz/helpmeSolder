<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 166 436" width="166" height="436" role="img" aria-label="E-paper 2.13 inch 250x122 (SPI), front view">
  <title>E-paper 2.13 inch 250x122 (SPI), front view</title>
  <!--
    2.13 inch e-paper panel (250x122) drawn portrait, with the amber flexible tail running to a small adapter board.
    Adapter board: FPC connector, DC/DC inductor and passives, 8-pin header along the bottom edge in the usual order VCC, GND, DIN, CLK, CS, DC, RST, BUSY.
    On the real module the tail folds the board behind the panel; it is shown below it so the header is visible.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="39" y="296" width="88" height="48" fill="#d9962b" stroke="#a86d12" stroke-width="1"/>
  <rect x="45" y="320" width="5.2" height="16" fill="#f2c75c"/>
  <rect x="54.5" y="320" width="5.2" height="16" fill="#f2c75c"/>
  <rect x="64" y="320" width="5.2" height="16" fill="#f2c75c"/>
  <rect x="73.5" y="320" width="5.2" height="16" fill="#f2c75c"/>
  <rect x="83" y="320" width="5.2" height="16" fill="#f2c75c"/>
  <rect x="92.5" y="320" width="5.2" height="16" fill="#f2c75c"/>
  <rect x="102" y="320" width="5.2" height="16" fill="#f2c75c"/>
  <rect x="111.5" y="320" width="5.2" height="16" fill="#f2c75c"/>
  <rect x="10" y="10" width="146" height="296" rx="3" fill="#e9e7df" stroke="#a7a498" stroke-width="1.5"/>
  <rect x="21" y="20" width="125" height="249" fill="#cfccc2"/>
  <rect x="24" y="23" width="119" height="243" fill="#f4f3ee" stroke="#3a3a37" stroke-width="1"/>
  <rect x="38" y="76.5" width="77.4" height="10.9" fill="#6d6d68" opacity="0.55"/>
  <rect x="38" y="120.2" width="56.4" height="10.9" fill="#6d6d68" opacity="0.55"/>
  <rect x="38" y="163.9" width="77.4" height="10.9" fill="#6d6d68" opacity="0.55"/>
  <circle cx="117" cy="47" r="9" fill="#2a2a28" opacity="0.7"/>
  <text class="label" x="83" y="298" text-anchor="middle" font-size="6.5" style="fill:#6e6b60" opacity="1">2.13 inch e-Paper</text>
  <rect x="10" y="322" width="146" height="104" rx="4" fill="#1565c0" stroke="#0b3d82" stroke-width="2"/>
  <circle cx="21" cy="334" r="3" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="145" cy="334" r="3" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <rect x="35" y="330" width="96" height="13" rx="1.5" fill="#1b1b1b" stroke="#000"/>
  <rect x="38" y="330" width="90" height="5" fill="#e7e2d3"/>
  <rect class="smd" x="30" y="352" width="8" height="5" rx="0.8"/>
  <rect class="smd" x="42" y="352" width="8" height="5" rx="0.8"/>
  <rect class="smd" x="54" y="352" width="8" height="5" rx="0.8"/>
  <rect x="102" y="349" width="16" height="14" rx="1.5" fill="#222" stroke="#000"/>
  <rect class="smd" x="124" y="352" width="8" height="5" rx="0.8"/>
  <rect class="smd" x="134" y="352" width="5" height="8" rx="0.8"/>
  <rect x="71" y="350" width="7" height="7" rx="1" fill="#444"/>
  <rect x="23" y="402" width="120" height="18" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="34" cy="411" r="5"/>
  <text class="pinlbl" x="34" y="397" transform="rotate(-90 34 397)" text-anchor="end" dy="3" font-size="7.5">VCC</text>
  <circle class="hole gnd" cx="48" cy="411" r="5"/>
  <text class="pinlbl" x="48" y="397" transform="rotate(-90 48 397)" text-anchor="end" dy="3" font-size="7.5">GND</text>
  <circle class="hole" cx="62" cy="411" r="5"/>
  <text class="pinlbl" x="62" y="397" transform="rotate(-90 62 397)" text-anchor="end" dy="3" font-size="7.5">DIN</text>
  <circle class="hole" cx="76" cy="411" r="5"/>
  <text class="pinlbl" x="76" y="397" transform="rotate(-90 76 397)" text-anchor="end" dy="3" font-size="7.5">CLK</text>
  <circle class="hole" cx="90" cy="411" r="5"/>
  <text class="pinlbl" x="90" y="397" transform="rotate(-90 90 397)" text-anchor="end" dy="3" font-size="7.5">CS</text>
  <circle class="hole" cx="104" cy="411" r="5"/>
  <text class="pinlbl" x="104" y="397" transform="rotate(-90 104 397)" text-anchor="end" dy="3" font-size="7.5">DC</text>
  <circle class="hole" cx="118" cy="411" r="5"/>
  <text class="pinlbl" x="118" y="397" transform="rotate(-90 118 397)" text-anchor="end" dy="3" font-size="7.5">RST</text>
  <circle class="hole" cx="132" cy="411" r="5"/>
  <text class="pinlbl" x="132" y="397" transform="rotate(-90 132 397)" text-anchor="end" dy="3" font-size="7.5">BUSY</text>
</svg>
