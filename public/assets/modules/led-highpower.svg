<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="High-power LED star board top view (original simplified drawing, CC0)">
  <title>High-power LED star board top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    20 mm aluminium star with a square emitter and a yellow phosphor dome; solder pads + (anode, left) and - (cathode, right).
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <polygon points="196,110 163.7,141 153,184.5 110,172 67,184.5 56.3,141 24,110 56.3,79 67,35.5 110,48 153,35.5 163.7,79" fill="#cfd8dc" stroke="#90a4ae" stroke-width="14" stroke-linejoin="round"/>
  <polygon points="196,110 163.7,141 153,184.5 110,172 67,184.5 56.3,141 24,110 56.3,79 67,35.5 110,48 153,35.5 163.7,79" fill="#cfd8dc" stroke="#cfd8dc" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="149" cy="177.5" r="5" fill="#f5f5f5" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="71" cy="177.5" r="5" fill="#f5f5f5" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="71" cy="42.5" r="5" fill="#f5f5f5" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="149" cy="42.5" r="5" fill="#f5f5f5" stroke="#78909c" stroke-width="1.5"/>
  <rect x="20" y="96" width="38" height="28" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="1.5"/>
  <rect x="162" y="96" width="38" height="28" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="1.5"/>
  <circle class="hole pwr" cx="38" cy="110" r="5.5"/>
  <circle class="hole gnd" style="stroke:#9e9e9e" cx="182" cy="110" r="5.5"/>
  <text x="38" y="92" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#b71c1c">+</text>
  <text x="182" y="92" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="bold" fill="#263238">-</text>
  <circle cx="110" cy="110" r="40" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <rect x="88" y="88" width="44" height="44" rx="4" fill="#f5f0e0" stroke="#bdb59a" stroke-width="1.5"/>
  <circle cx="110" cy="110" r="17" fill="#ffe066" stroke="#e0b800" stroke-width="1.5"/>
  <circle cx="104" cy="104" r="6" fill="#fff" opacity="0.6"/>
</svg>
