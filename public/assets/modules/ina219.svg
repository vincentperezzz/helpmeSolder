<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 232" width="190" height="232" role="img" aria-label="INA219 current and voltage sensor top view (original simplified drawing, CC0)">
  <title>INA219 current and voltage sensor top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Blue board: 2-pole screw terminal VIN+ and VIN- (the circuit being measured), R100 shunt, INA219 chip, A0/A1 address pads.
    Header left to right: VCC, GND, SCL, SDA. Wire VIN+/VIN- in series with the load, not to the microcontroller.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="20" y="34" width="150" height="184" rx="5" fill="#1f56b0" stroke="#143c80" stroke-width="2"/>
  <rect x="63" y="12" width="64" height="34" rx="2" fill="#2a7de1" stroke="#0d3c7a"/>
  <circle cx="79" cy="29" r="10.2" fill="#cfd8dc" stroke="#546e7a"/>
  <path d="M72.2 29 H85.8" stroke="#546e7a" stroke-width="1.2"/>
  <circle cx="111" cy="29" r="10.2" fill="#cfd8dc" stroke="#546e7a"/>
  <path d="M104.2 29 H117.8" stroke="#546e7a" stroke-width="1.2"/>
  <text class="label" x="79" y="64" text-anchor="middle" font-size="7">VIN+</text>
  <text class="label" x="111" y="64" text-anchor="middle" font-size="7">VIN-</text>
  <rect x="80" y="76" width="30" height="12" rx="1.5" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  <rect x="76" y="76" width="5" height="12" rx="0" fill="#cfd8dc"/>
  <rect x="109" y="76" width="5" height="12" rx="0" fill="#cfd8dc"/>
  <text class="label" x="95" y="85" text-anchor="middle" font-size="5.5">R100</text>
  <rect x="77" y="108.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="109" y="108.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="77" y="112.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="109" y="112.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="77" y="116.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="109" y="116.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="77" y="120.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="109" y="120.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="81" y="108" width="28" height="16" rx="1.5" fill="#1a1a1a" stroke="#000" stroke-width="0.8"/>
  <circle cx="85" cy="112" r="1.2" fill="#555"/>
  <text class="label" x="95" y="118" text-anchor="middle" font-size="5.5">INA219</text>
  <rect x="30" y="104" width="8" height="8" rx="0" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <rect x="30" y="116" width="8" height="8" rx="0" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <text class="label" x="44" y="111" text-anchor="start" font-size="6">A0</text>
  <text class="label" x="44" y="123" text-anchor="start" font-size="6">A1</text>
  <rect x="138" y="100" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <rect x="138" y="112" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <rect x="138" y="124" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <circle cx="68" cy="196" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="68" cy="196" r="5"/>
  <text class="pinlbl" x="68" y="182" transform="rotate(-90 68 182)" text-anchor="start" dy="2.7" font-size="7.5">VCC</text>
  <circle cx="86" cy="196" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole gnd" cx="86" cy="196" r="5"/>
  <text class="pinlbl" x="86" y="182" transform="rotate(-90 86 182)" text-anchor="start" dy="2.7" font-size="7.5">GND</text>
  <circle cx="104" cy="196" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="104" cy="196" r="5"/>
  <text class="pinlbl" x="104" y="182" transform="rotate(-90 104 182)" text-anchor="start" dy="2.7" font-size="7.5">SCL</text>
  <circle cx="122" cy="196" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="122" cy="196" r="5"/>
  <text class="pinlbl" x="122" y="182" transform="rotate(-90 122 182)" text-anchor="start" dy="2.7" font-size="7.5">SDA</text>
</svg>
