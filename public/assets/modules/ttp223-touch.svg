<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 190" width="150" height="190" role="img" aria-label="TTP223 capacitive touch module top view (original simplified drawing, CC0)">
  <title>TTP223 capacitive touch module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Common blue TTP223 board: round gold touch pad, SOT-23-6 chip, LED, solder pads A and B.
    Header left to right: I/O, VCC, GND.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="20" y="14" width="110" height="162" rx="5" fill="#1f56b0" stroke="#143c80" stroke-width="2"/>
  <circle cx="57" cy="36" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="57" cy="36" r="5"/>
  <text class="pinlbl" x="57" y="50" transform="rotate(90 57 50)" text-anchor="start" dy="2.7" font-size="7.5">I/O</text>
  <circle cx="75" cy="36" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="75" cy="36" r="5"/>
  <text class="pinlbl" x="75" y="50" transform="rotate(90 75 50)" text-anchor="start" dy="2.7" font-size="7.5">VCC</text>
  <circle cx="93" cy="36" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole gnd" cx="93" cy="36" r="5"/>
  <text class="pinlbl" x="93" y="50" transform="rotate(90 93 50)" text-anchor="start" dy="2.7" font-size="7.5">GND</text>
  <circle cx="75" cy="120" r="44" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <circle cx="75" cy="120" r="36" fill="#1f56b0"/>
  <circle cx="75" cy="120" r="31" fill="#d9b44a"/>
  <circle cx="75" cy="120" r="5" fill="#a07d1c"/>
  <rect x="30" y="82" width="12" height="8" rx="1" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
  <rect x="31" y="90" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="35" y="90" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="39" y="90" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="32" y="79" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="38" y="79" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="104" y="82" width="9" height="5" rx="1" fill="#ef5350" stroke="#00000066" stroke-width="0.6"/>
  <rect x="106.5" y="83.2" width="4" height="2.6" rx="1" fill="#ffffff88"/>
  <rect x="108" y="92" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <rect x="26" y="150" width="9" height="9" rx="0" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <rect x="115" y="150" width="9" height="9" rx="0" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <text class="label" x="30" y="168" text-anchor="middle" font-size="7">A</text>
  <text class="label" x="119" y="168" text-anchor="middle" font-size="7">B</text>
</svg>
