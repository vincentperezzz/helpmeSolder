  <line x1="113" y1="150" x2="113" y2="248" stroke="#607d8b" stroke-width="6" stroke-linecap="round"/>
  <line x1="113" y1="150" x2="113" y2="248" stroke="#cfd8dc" stroke-width="4" stroke-linecap="round"/>
