<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 400" width="180" height="400" role="img" aria-label="Force sensitive resistor FSR 402 style (original simplified drawing, CC0)">
  <title>Force sensitive resistor FSR 402 style (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    Round pressure pad on a thin tail with two leads; no polarity. Wire it in a voltage divider with about 10 kohm.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="65" y="140" width="50" height="210" rx="3" fill="#d7ccc8" stroke="#a1887f" stroke-width="1"/>
  <rect x="77" y="140" width="4" height="200" rx="0" fill="#b0bec5"/>
  <rect x="99" y="140" width="4" height="200" rx="0" fill="#b0bec5"/>
  <circle cx="90" cy="84" r="72" fill="#d7ccc8" stroke="#a1887f" stroke-width="1.5"/>
  <circle cx="90" cy="84" r="56" fill="#2b2b2b" stroke="#000" stroke-width="1.5"/>
  <circle cx="90" cy="84" r="40" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="90" cy="84" r="6" fill="#555"/>
  <rect x="74" y="336" width="8" height="36" rx="2" fill="#cfd8dc" stroke="#78909c" stroke-width="1"/>
  <text class="label" x="78" y="392" text-anchor="middle" font-size="10" style="fill:#78909c">1</text>
  <rect x="98" y="336" width="8" height="36" rx="2" fill="#cfd8dc" stroke="#78909c" stroke-width="1"/>
  <text class="label" x="102" y="392" text-anchor="middle" font-size="10" style="fill:#78909c">2</text>
</svg>
