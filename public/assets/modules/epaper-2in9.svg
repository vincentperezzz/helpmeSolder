  <text class="pinlbl" x="71.5" y="457" transform="rotate(-90 71.5 457)" text-anchor="end" dy="3" font-size="7.5">DIN</text>
  <circle class="hole" cx="85.5" cy="471" r="5"/>
  <text class="pinlbl" x="85.5" y="457" transform="rotate(-90 85.5 457)" text-anchor="end" dy="3" font-size="7.5">CLK</text>
  <circle class="hole" cx="99.5" cy="471" r="5"/>
  <text class="pinlbl" x="99.5" y="457" transform="rotate(-90 99.5 457)" text-anchor="end" dy="3" font-size="7.5">CS</text>
  <circle class="hole" cx="113.5" cy="471" r="5"/>
  <text class="pinlbl" x="113.5" y="457" transform="rotate(-90 113.5 457)" text-anchor="end" dy="3" font-size="7.5">DC</text>
  <circle class="hole" cx="127.5" cy="471" r="5"/>
  <text class="pinlbl" x="127.5" y="457" transform="rotate(-90 127.5 457)" text-anchor="end" dy="3" font-size="7.5">RST</text>
  <circle class="hole" cx="141.5" cy="471" r="5"/>
  <text class="pinlbl" x="141.5" y="457" transform="rotate(-90 141.5 457)" text-anchor="end" dy="3" font-size="7.5">BUSY</text>
</svg>
