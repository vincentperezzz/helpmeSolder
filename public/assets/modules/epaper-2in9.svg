<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 496" width="185" height="496" role="img" aria-label="E-paper 2.9 inch 296x128 (SPI), front view">
  <title>E-paper 2.9 inch 296x128 (SPI), front view</title>
  <!--
    2.9 inch e-paper panel (296x128) drawn portrait, with the amber flexible tail running to a small adapter board.
    Adapter board: FPC connector, DC/DC inductor and passives, 8-pin header along the bottom edge in the usual order VCC, GND, DIN, CLK, CS, DC, RST, BUSY.
    On the real module the tail folds the board behind the panel; it is shown below it so the header is visible.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="43" y="356" width="99" height="48" fill="#d9962b" stroke="#a86d12" stroke-width="1"/>
  <rect x="49" y="380" width="6" height="16" fill="#f2c75c"/>
  <rect x="59.9" y="380" width="6" height="16" fill="#f2c75c"/>
  <rect x="70.8" y="380" width="6" height="16" fill="#f2c75c"/>
  <rect x="81.6" y="380" width="6" height="16" fill="#f2c75c"/>
  <rect x="92.5" y="380" width="6" height="16" fill="#f2c75c"/>
  <rect x="103.4" y="380" width="6" height="16" fill="#f2c75c"/>
  <rect x="114.3" y="380" width="6" height="16" fill="#f2c75c"/>
  <rect x="125.1" y="380" width="6" height="16" fill="#f2c75c"/>
  <rect x="10" y="10" width="165" height="356" rx="3" fill="#e9e7df" stroke="#a7a498" stroke-width="1.5"/>
  <rect x="24" y="18" width="137" height="307" fill="#cfccc2"/>
  <rect x="27" y="21" width="131" height="301" fill="#f4f3ee" stroke="#3a3a37" stroke-width="1"/>
  <rect x="41" y="87.2" width="87.6" height="13.5" fill="#6d6d68" opacity="0.55"/>
  <rect x="41" y="141.4" width="63.9" height="13.5" fill="#6d6d68" opacity="0.55"/>
  <rect x="41" y="195.6" width="87.6" height="13.5" fill="#6d6d68" opacity="0.55"/>
  <circle cx="132" cy="45" r="9" fill="#2a2a28" opacity="0.7"/>
  <text class="label" x="92.5" y="358" text-anchor="middle" font-size="6.5" style="fill:#6e6b60" opacity="1">2.9 inch e-Paper</text>
  <rect x="10" y="382" width="165" height="104" rx="4" fill="#1565c0" stroke="#0b3d82" stroke-width="2"/>
  <circle cx="21" cy="394" r="3" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="164" cy="394" r="3" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <rect x="39" y="390" width="107" height="13" rx="1.5" fill="#1b1b1b" stroke="#000"/>
  <rect x="42" y="390" width="101" height="5" fill="#e7e2d3"/>
  <rect class="smd" x="30" y="412" width="8" height="5" rx="0.8"/>
  <rect class="smd" x="42" y="412" width="8" height="5" rx="0.8"/>
  <rect class="smd" x="54" y="412" width="8" height="5" rx="0.8"/>
  <rect x="121" y="409" width="16" height="14" rx="1.5" fill="#222" stroke="#000"/>
  <rect class="smd" x="143" y="412" width="8" height="5" rx="0.8"/>
  <rect class="smd" x="153" y="412" width="5" height="8" rx="0.8"/>
  <rect x="80.5" y="410" width="7" height="7" rx="1" fill="#444"/>
  <rect x="32.5" y="462" width="120" height="18" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="43.5" cy="471" r="5"/>
  <text class="pinlbl" x="43.5" y="457" transform="rotate(-90 43.5 457)" text-anchor="end" dy="3" font-size="7.5">VCC</text>
