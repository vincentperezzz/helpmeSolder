<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 196" width="130" height="196" role="img" aria-label="A3144 Hall sensor board KY-003 top view (original simplified drawing, CC0)">
  <title>A3144 Hall sensor board KY-003 top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    KY-003: A3144 in a TO-92 package (printed face shown), LED and resistor, 3-pin header.
    Header left to right: S (signal), + (VCC), - (GND). Silkscreen order differs on some boards; check yours.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="15" y="14" width="100" height="168" rx="5" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <circle cx="47" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="47" cy="34" r="5"/>
  <text class="pinlbl" x="47" y="48" transform="rotate(90 47 48)" text-anchor="start" dy="2.7" font-size="7.5">S</text>
  <circle cx="65" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="65" cy="34" r="5"/>
  <text class="pinlbl" x="65" y="48" transform="rotate(90 65 48)" text-anchor="start" dy="2.7" font-size="7.5">+</text>
  <circle cx="83" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="83" cy="34" r="5"/>
  <text class="pinlbl" x="83" y="48" transform="rotate(90 83 48)" text-anchor="start" dy="2.7" font-size="7.5">-</text>
  <rect x="44.5" y="124" width="5" height="20" rx="0" fill="#cfd8dc" stroke="#78909c" stroke-width="0.6"/>
  <rect x="62.5" y="124" width="5" height="20" rx="0" fill="#cfd8dc" stroke="#78909c" stroke-width="0.6"/>
  <rect x="80.5" y="124" width="5" height="20" rx="0" fill="#cfd8dc" stroke="#78909c" stroke-width="0.6"/>
  <path d="M41 126 V96 A24 24 0 0 1 89 96 V126 Z" fill="#232323" stroke="#000" stroke-width="1"/>
  <text class="label" x="65" y="108" text-anchor="middle" font-size="7">3144</text>
  <rect x="22" y="148" width="9" height="5" rx="1" fill="#ef5350" stroke="#00000066" stroke-width="0.6"/>
  <rect x="24.5" y="149.2" width="4" height="2.6" rx="1" fill="#ffffff88"/>
  <rect x="86" y="154" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <rect x="92" y="130" width="5" height="10" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <rect x="24" y="164" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <text class="label" x="65" y="172" text-anchor="middle" font-size="7">KY-003</text>
</svg>
