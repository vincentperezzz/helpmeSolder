<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 180" width="170" height="180" role="img" aria-label="BMP280 breakout top view (original simplified drawing, CC0)">
  <title>BMP280 breakout top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    BMP280 breakout with the metal-lidded sensor (rectangular lid), 3.3 V regulator and a 6-pin header.
    Header left to right: VCC, GND, SCL, SDA, CSB, SDO (4-pin boards omit CSB and SDO). Board colour varies by seller.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="20" y="14" width="130" height="152" rx="5" fill="#1f56b0" stroke="#143c80" stroke-width="2"/>
  <circle cx="40" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="40" cy="34" r="5"/>
  <text class="pinlbl" x="40" y="48" transform="rotate(90 40 48)" text-anchor="start" dy="2.7" font-size="7.5">VCC</text>
  <circle cx="58" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole gnd" cx="58" cy="34" r="5"/>
  <text class="pinlbl" x="58" y="48" transform="rotate(90 58 48)" text-anchor="start" dy="2.7" font-size="7.5">GND</text>
  <circle cx="76" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="76" cy="34" r="5"/>
  <text class="pinlbl" x="76" y="48" transform="rotate(90 76 48)" text-anchor="start" dy="2.7" font-size="7.5">SCL</text>
  <circle cx="94" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="94" cy="34" r="5"/>
  <text class="pinlbl" x="94" y="48" transform="rotate(90 94 48)" text-anchor="start" dy="2.7" font-size="7.5">SDA</text>
  <circle cx="112" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="112" cy="34" r="5"/>
  <text class="pinlbl" x="112" y="48" transform="rotate(90 112 48)" text-anchor="start" dy="2.7" font-size="7.5">CSB</text>
  <circle cx="130" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="130" cy="34" r="5"/>
  <text class="pinlbl" x="130" y="48" transform="rotate(90 130 48)" text-anchor="start" dy="2.7" font-size="7.5">SDO</text>
  <rect x="71" y="96" width="28" height="22" rx="2" fill="#cfd8dc" stroke="#607d8b" stroke-width="1"/>
  <circle cx="79" cy="103" r="2.4" fill="#37474f"/>
  <rect x="118" y="92" width="12" height="8" rx="1" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
  <rect x="119" y="100" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="123" y="100" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="127" y="100" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="120" y="89" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="126" y="89" width="2" height="3" rx="0" fill="#cfd8dc"/>
  <rect x="32" y="90" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <rect x="32" y="100" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <rect x="124" y="114" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <rect x="124" y="124" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <rect x="32" y="124" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <text class="label" x="85" y="152" text-anchor="middle" font-size="8">BMP280</text>
</svg>
