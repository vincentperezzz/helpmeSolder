<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 266" width="160" height="266" role="img" aria-label="TMP36 TO-92 sensor front view (original simplified drawing, CC0)">
  <title>TMP36 TO-92 sensor front view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified view for HelpmeSolder wiring diagrams.
    TO-92 with the flat face toward you and the legs down: +Vs, Vout, GND from the left.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <path d="M30 130 V100 A50 50 0 0 1 130 100 V130 Z" fill="#1d1d1d" stroke="#000" stroke-width="2"/>
  <path d="M38 126 V100 A42 42 0 0 1 60 62" fill="none" stroke="#555" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <text class="label" x="80" y="94" text-anchor="middle" font-size="12" font-weight="bold">TMP36</text>
  <text class="label" x="80" y="112" text-anchor="middle" font-size="8" opacity="0.8">GZ  0A</text>
  <rect class="metal" x="52" y="130" width="6" height="104" rx="1"/>
  <rect class="metal" x="77" y="130" width="6" height="104" rx="1"/>
  <rect class="metal" x="102" y="130" width="6" height="104" rx="1"/>
  <circle class="hole pwr" cx="55" cy="236" r="5"/><text x="55" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#37474f">+Vs</text>
  <circle class="hole" cx="80" cy="236" r="5"/><text x="80" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#37474f">Vout</text>
  <circle class="hole gnd" style="stroke:#9e9e9e" cx="105" cy="236" r="5"/><text x="105" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#37474f">GND</text>
</svg>
