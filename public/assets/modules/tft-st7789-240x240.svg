<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 206 278" width="206" height="278" role="img" aria-label="TFT ST7789 240x240 (SPI), front view">
  <title>TFT ST7789 240x240 (SPI), front view</title>
  <!--
    1.3 inch ST7789 IPS breakout, about 27 x 33 mm black board, about 7 units per mm.
    7-pin header along the top: GND, VCC, SCL, SDA, RES, DC, BLK. The CS pad exists only on some boards; it is drawn as an extra solder pad after BLK.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="8" y="8" width="190" height="262" rx="6" fill="#1b1e24" stroke="#0a0b0e" stroke-width="2"/>
  <circle cx="20" cy="20" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="186" cy="20" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <rect x="31" y="21" width="112" height="18" rx="2" fill="#1b1b1b"/>
  <circle class="hole gnd" cx="42" cy="30" r="5"/>
  <text class="pinlbl" x="42" y="44" transform="rotate(90 42 44)" text-anchor="start" dy="3" font-size="7.5">GND</text>
  <circle class="hole" cx="57" cy="30" r="5"/>
  <text class="pinlbl" x="57" y="44" transform="rotate(90 57 44)" text-anchor="start" dy="3" font-size="7.5">VCC</text>
  <circle class="hole" cx="72" cy="30" r="5"/>
  <text class="pinlbl" x="72" y="44" transform="rotate(90 72 44)" text-anchor="start" dy="3" font-size="7.5">SCL</text>
  <circle class="hole" cx="87" cy="30" r="5"/>
  <text class="pinlbl" x="87" y="44" transform="rotate(90 87 44)" text-anchor="start" dy="3" font-size="7.5">SDA</text>
  <circle class="hole" cx="102" cy="30" r="5"/>
  <text class="pinlbl" x="102" y="44" transform="rotate(90 102 44)" text-anchor="start" dy="3" font-size="7.5">RES</text>
  <circle class="hole" cx="117" cy="30" r="5"/>
  <text class="pinlbl" x="117" y="44" transform="rotate(90 117 44)" text-anchor="start" dy="3" font-size="7.5">DC</text>
  <circle class="hole" cx="132" cy="30" r="5"/>
  <text class="pinlbl" x="132" y="44" transform="rotate(90 132 44)" text-anchor="start" dy="3" font-size="7.5">BLK</text>
  <rect x="141" y="24" width="12" height="12" rx="2" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="147" cy="30" r="3"/>
  <text class="pinlbl muted" x="147" y="44" transform="rotate(90 147 44)" dy="3" font-size="7.5">CS</text>
  <rect x="16" y="78" width="166" height="184" rx="3" fill="#0d0d10" stroke="#000" stroke-width="1.5"/>
  <rect x="29" y="92" width="140" height="140" fill="#0a1626" stroke="#1d2a3d" stroke-width="1"/>
  <polygon points="29,232 99,92 129.8,92 59.8,232" fill="#fff" opacity="0.07"/>
  <polygon points="71,232 134,92 143.8,92 80.8,232" fill="#fff" opacity="0.05"/>
  <text class="label" x="99" y="250" text-anchor="middle" font-size="7" style="fill:#9aa3b2" opacity="1">1.3 IPS 240x240</text>
</svg>
