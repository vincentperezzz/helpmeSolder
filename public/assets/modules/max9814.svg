<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 214" width="160" height="214" role="img" aria-label="MAX9814 microphone amplifier board top view (original simplified drawing, CC0)">
  <title>MAX9814 microphone amplifier board top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Small board: electret microphone can, MAX9814 AGC amplifier chip, gain jumper pads, 5-pin header.
    Header left to right: GND, VDD, GAIN, A/R, OUT. Board colour varies by seller.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="20" y="14" width="120" height="186" rx="5" fill="#c62828" stroke="#8e0000" stroke-width="2"/>
  <circle cx="44" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole gnd" cx="44" cy="34" r="5"/>
  <text class="pinlbl" x="44" y="48" transform="rotate(90 44 48)" text-anchor="start" dy="2.7" font-size="7.5">GND</text>
  <circle cx="62" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="62" cy="34" r="5"/>
  <text class="pinlbl" x="62" y="48" transform="rotate(90 62 48)" text-anchor="start" dy="2.7" font-size="7.5">VDD</text>
  <circle cx="80" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="80" cy="34" r="5"/>
  <text class="pinlbl" x="80" y="48" transform="rotate(90 80 48)" text-anchor="start" dy="2.7" font-size="7.5">GAIN</text>
  <circle cx="98" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="98" cy="34" r="5"/>
  <text class="pinlbl" x="98" y="48" transform="rotate(90 98 48)" text-anchor="start" dy="2.7" font-size="7.5">A/R</text>
  <circle cx="116" cy="34" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="116" cy="34" r="5"/>
  <text class="pinlbl" x="116" y="48" transform="rotate(90 116 48)" text-anchor="start" dy="2.7" font-size="7.5">OUT</text>
  <circle cx="80" cy="118" r="30" fill="#b0bec5" stroke="#607d8b" stroke-width="1.5"/>
  <circle cx="80" cy="118" r="24" fill="#cfd8dc" stroke="#78909c" stroke-width="1"/>
  <circle cx="80" cy="118" r="6" fill="#212121"/>
  <rect x="29" y="162.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="51" y="162.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="29" y="166.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="51" y="166.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="29" y="170.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="51" y="170.8" width="4" height="2.4" rx="0" fill="#cfd8dc"/>
  <rect x="33" y="162" width="18" height="12" rx="1.5" fill="#1a1a1a" stroke="#000" stroke-width="0.8"/>
  <circle cx="37" cy="166" r="1.2" fill="#555"/>
  <text class="label" x="42" y="170" text-anchor="middle" font-size="5">9814</text>
  <rect x="66" y="160" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <rect x="66" y="172" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <rect x="92" y="164" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <rect x="104" y="164" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <rect x="118" y="154" width="8" height="8" rx="0" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <rect x="118" y="168" width="8" height="8" rx="0" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <text class="label" x="80" y="192" text-anchor="middle" font-size="7">MAX9814</text>
</svg>
