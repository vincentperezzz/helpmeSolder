<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 230" width="240" height="230" role="img" aria-label="Schottky diode 1N5819 (original simplified drawing, CC0)">
  <title>Schottky diode 1N5819 (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    Black DO-41 Schottky diode with a grey band at the cathode end (C).
    Anode left, cathode (band) right.
  -->
  <defs>
