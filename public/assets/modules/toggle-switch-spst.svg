  <path d="M84 70 L104 16" stroke="#607d8b" stroke-width="16" stroke-linecap="round"/>
  <path d="M84 70 L104 16" stroke="#eceff1" stroke-width="11" stroke-linecap="round"/>
  <rect x="66" y="64" width="48" height="52" rx="3" fill="#b0bec5" stroke="#546e7a" stroke-width="2"/>
  <path d="M66 78 H114 M66 90 H114 M66 102 H114" stroke="#78909c" stroke-width="1.5"/>
  <path d="M52 116 H128 V132 H52 Z" fill="#cfd8dc" stroke="#546e7a" stroke-width="2"/>
