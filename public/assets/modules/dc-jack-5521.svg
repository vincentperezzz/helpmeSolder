<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 260" width="230" height="260" role="img" aria-label="DC barrel jack 5.5 x 2.1 mm top view (original simplified drawing, CC0)">
  <title>DC barrel jack 5.5 x 2.1 mm top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    Black PCB barrel socket seen from above: barrel opening at the top, centre pin visible inside, three pins behind.
    Pins left to right: sleeve (-), centre (+), switch pin (unused). Centre-positive adapters assumed.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="108" y="182" width="14" height="62" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <rect x="66" y="182" width="14" height="44" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <rect x="150" y="182" width="14" height="44" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <rect x="33" y="18" width="164" height="168" rx="5" fill="#1d1d1d" stroke="#000" stroke-width="2"/>
  <rect x="53" y="18" width="124" height="76" fill="#050505" stroke="#37474f" stroke-width="2"/>
  <rect x="63" y="24" width="104" height="64" fill="#0d0d0d" stroke="#455a64" stroke-width="1.5"/>
  <rect x="110" y="24" width="10" height="48" rx="3" fill="#cfd8dc" stroke="#607d8b" stroke-width="1.5"/>
  <text x="115" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#eceff1" font-weight="bold">DC IN</text>
  <text x="115" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#b0bec5">5.5 x 2.1 mm</text>
  <rect x="66.2" y="206" width="13.6" height="14" rx="7" fill="#263238" opacity="0.92"/>
  <text x="73" y="217" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#eceff1">−</text>
  <rect x="108.2" y="212" width="13.6" height="14" rx="7" fill="#263238" opacity="0.92"/>
  <text x="115" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#eceff1">+</text>
</svg>
