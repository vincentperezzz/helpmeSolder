  <path d="M72 40 V100 M80 40 V100 M88 40 V100 M96 40 V100 M104 40 V100 M112 40 V100 M120 40 V100 M128 40 V100 M136 40 V100 M144 40 V100 M152 40 V100 M160 40 V100" stroke="#8a4f12" stroke-width="1" opacity="0.7"/>
  <rect class="metal" x="170" y="58" width="82" height="24" rx="3"/>
  <circle cx="240" cy="70" r="5" fill="#f5f5f5" stroke="#607d8b" stroke-width="1.5"/>
  <rect x="176" y="52" width="6" height="36" rx="2" fill="#546e7a"/>
