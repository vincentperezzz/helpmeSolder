<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 200" width="210" height="200" role="img" aria-label="PAM8403 amplifier module top view (original simplified drawing, CC0)">
  <title>PAM8403 amplifier module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Small blue board: speaker pads L+ L- R+ R- on the top edge, power 5V GND and audio L G R on the bottom edge, 8403 chip, round volume pot.
    The audio ground pad G is joined to GND on the real board, so only the power GND is wired.
    Pad order varies by board; this is the most common version.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="10" y="10" width="190" height="180" rx="5" fill="#1f56b0" stroke="#143c80" stroke-width="2"/>
  <circle class="hole" cx="44" cy="28" r="6"/>
  <text class="pinlbl" x="44" y="42" transform="rotate(90 44 42)" text-anchor="start" dy="3" font-size="7.5">L+</text>
  <circle class="hole" cx="66" cy="28" r="6"/>
  <text class="pinlbl" x="66" y="42" transform="rotate(90 66 42)" text-anchor="start" dy="3" font-size="7.5">L-</text>
  <circle class="hole" cx="88" cy="28" r="6"/>
  <text class="pinlbl" x="88" y="42" transform="rotate(90 88 42)" text-anchor="start" dy="3" font-size="7.5">R+</text>
  <circle class="hole" cx="110" cy="28" r="6"/>
  <text class="pinlbl" x="110" y="42" transform="rotate(90 110 42)" text-anchor="start" dy="3" font-size="7.5">R-</text>
  <circle class="hole pwr" cx="36" cy="176" r="6"/>
  <text class="pinlbl" x="36" y="162" transform="rotate(-90 36 162)" text-anchor="end" dy="3" font-size="7.5">5V</text>
  <circle class="hole gnd" cx="56" cy="176" r="6"/>
  <text class="pinlbl" x="56" y="162" transform="rotate(-90 56 162)" text-anchor="end" dy="3" font-size="7.5">GND</text>
  <circle class="hole" cx="120" cy="176" r="6"/>
  <text class="pinlbl" x="120" y="162" transform="rotate(-90 120 162)" text-anchor="end" dy="3" font-size="7.5">L</text>
  <circle class="hole" cx="140" cy="176" r="6"/>
  <text class="pinlbl" x="140" y="162" transform="rotate(-90 140 162)" text-anchor="end" dy="3" font-size="7.5">G</text>
  <circle class="hole" cx="160" cy="176" r="6"/>
  <text class="pinlbl" x="160" y="162" transform="rotate(-90 160 162)" text-anchor="end" dy="3" font-size="7.5">R</text>
  <rect class="smd" x="70" y="85" width="3" height="3"/>
  <rect class="smd" x="70" y="107" width="3" height="3"/>
  <rect class="smd" x="75.6" y="85" width="3" height="3"/>
  <rect class="smd" x="75.6" y="107" width="3" height="3"/>
  <rect class="smd" x="81.2" y="85" width="3" height="3"/>
  <rect class="smd" x="81.2" y="107" width="3" height="3"/>
  <rect class="smd" x="86.8" y="85" width="3" height="3"/>
  <rect class="smd" x="86.8" y="107" width="3" height="3"/>
  <rect class="smd" x="92.4" y="85" width="3" height="3"/>
  <rect class="smd" x="92.4" y="107" width="3" height="3"/>
  <rect class="smd" x="98" y="85" width="3" height="3"/>
  <rect class="smd" x="98" y="107" width="3" height="3"/>
  <rect class="smd" x="103.6" y="85" width="3" height="3"/>
  <rect class="smd" x="103.6" y="107" width="3" height="3"/>
  <rect class="smd" x="109.19999999999999" y="85" width="3" height="3"/>
  <rect class="smd" x="109.19999999999999" y="107" width="3" height="3"/>
  <rect class="chip" x="66" y="88" width="48" height="19" rx="2"/>
  <circle cx="71" cy="93" r="1.5" fill="#666"/>
  <text class="label" x="92" y="100" text-anchor="middle" font-size="7">8403</text>
  <circle cx="150" cy="104" r="26" fill="#263238" stroke="#000" stroke-width="1.5"/>
  <circle cx="150" cy="104" r="17" fill="#cfd8dc" stroke="#607d8b"/>
  <path d="M142 112 L158 96" stroke="#546e7a" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="150" y="140" text-anchor="middle" font-size="6">VOL</text>
  <rect class="smd" x="70" y="124" width="9" height="5" rx="1"/>
  <rect class="smd" x="84" y="124" width="9" height="5" rx="1"/>
  <rect class="smd" x="98" y="124" width="9" height="5" rx="1"/>
  <rect x="68" y="136" width="14" height="14" rx="3" fill="#263238" stroke="#000"/>
  <rect x="68" y="136" width="14" height="4" fill="#b0bec5"/>
</svg>
