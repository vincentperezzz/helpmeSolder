<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 232" width="200" height="232" role="img" aria-label="LoRa SX127x Ra-02 module top view (original simplified drawing, CC0)">
  <title>LoRa SX127x Ra-02 module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Ra-02 style: 16 castellated pads, 8 per side at 2 mm pitch. Left top to bottom: GND MISO MOSI SCK NSS RESET DIO5 GND.
    Right top to bottom: DIO2 DIO1 DIO0 3.3V DIO4 DIO3 GND ANT. The antenna is the ANT pad (bottom right).
    Wires use the top-left GND pad; the other GND pads are the same net.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="10" y="10" width="180" height="214" rx="4" fill="#1f4fa8" stroke="#143c80" stroke-width="2"/>
  <rect x="8" y="26" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="17" cy="34" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="32" y="37" text-anchor="start" style="font-size:7.5px">GND</text>
  <rect x="8" y="50" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="17" cy="58" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="32" y="61" text-anchor="start" style="font-size:7.5px">MISO</text>
  <rect x="8" y="74" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="17" cy="82" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="32" y="85" text-anchor="start" style="font-size:7.5px">MOSI</text>
  <rect x="8" y="98" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="17" cy="106" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="32" y="109" text-anchor="start" style="font-size:7.5px">SCK</text>
  <rect x="8" y="122" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="17" cy="130" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="32" y="133" text-anchor="start" style="font-size:7.5px">NSS</text>
  <rect x="8" y="146" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="17" cy="154" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="32" y="157" text-anchor="start" style="font-size:7.5px">RESET</text>
  <rect x="8" y="170" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="17" cy="178" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="32" y="181" text-anchor="start" style="font-size:7.5px">DIO5</text>
  <rect x="8" y="194" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="17" cy="202" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="32" y="205" text-anchor="start" style="font-size:7.5px">GND</text>
  <rect x="174" y="26" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="183" cy="34" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="168" y="37" text-anchor="end" style="font-size:7.5px">DIO2</text>
  <rect x="174" y="50" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="183" cy="58" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="168" y="61" text-anchor="end" style="font-size:7.5px">DIO1</text>
  <rect x="174" y="74" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="183" cy="82" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="168" y="85" text-anchor="end" style="font-size:7.5px">DIO0</text>
  <rect x="174" y="98" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="183" cy="106" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="168" y="109" text-anchor="end" style="font-size:7.5px">3.3V</text>
  <rect x="174" y="122" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="183" cy="130" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="168" y="133" text-anchor="end" style="font-size:7.5px">DIO4</text>
  <rect x="174" y="146" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="183" cy="154" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="168" y="157" text-anchor="end" style="font-size:7.5px">DIO3</text>
  <rect x="174" y="170" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="183" cy="178" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="168" y="181" text-anchor="end" style="font-size:7.5px">GND</text>
  <rect x="174" y="194" width="18" height="16" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle cx="183" cy="202" r="3.2" fill="#263238"/>
  <text class="pinlbl" x="168" y="205" text-anchor="end" style="font-size:7.5px">ANT</text>
  <rect class="metal" x="64" y="40" width="72" height="104" rx="2"/>
  <rect x="69" y="45" width="62" height="94" rx="1" fill="none" stroke="#78909c" stroke-width="0.8"/>
  <text class="label" x="100" y="86" text-anchor="middle" style="font-size:12px;fill:#37474f">Ra-02</text>
  <text class="label" x="100" y="100" text-anchor="middle" style="font-size:7px;fill:#546e7a">SX1278</text>
  <text class="label" x="100" y="110" text-anchor="middle" style="font-size:6px;fill:#546e7a">433 MHz</text>
  <rect class="smd" x="72" y="158" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="84" y="158" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="96" y="158" width="6" height="4" rx="0.6"/>
  <rect class="chip" x="110" y="152" width="18" height="16" rx="1.5"/>
  <text class="label" x="100" y="196" text-anchor="middle" style="font-size:8px">LoRa</text>
  <text class="label" x="100" y="208" text-anchor="middle" style="font-size:6px;fill:#cfd8dc">Ai-Thinker Ra-02</text>
</svg>
