<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 170" width="340" height="170" role="img" aria-label="LM2596 buck converter module top view (original simplified drawing, CC0)">
  <title>LM2596 buck converter module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    Blue board: IN+ / IN- pads at the left, OUT+ / OUT- at the right (the most common silkscreen).
    LM2596 chip, big silver inductor, input and output electrolytic caps, blue trimmer with a brass screw sets the output voltage.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="2" y="2" width="336" height="166" rx="6" fill="#1f56b0" stroke="#143c80" stroke-width="2"/>
  <circle cx="22" cy="28" r="11" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <circle class="hole" cx="22" cy="28" r="5.5"/>
  <text x="38" y="31" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#eceff1" font-weight="bold">IN+</text>
  <circle cx="22" cy="142" r="11" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <circle class="hole" cx="22" cy="142" r="5.5"/>
  <text x="38" y="145" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#eceff1" font-weight="bold">IN-</text>
  <circle cx="318" cy="28" r="11" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
