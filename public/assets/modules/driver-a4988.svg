<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 244" width="180" height="244" role="img" aria-label="A4988 stepper driver top view (original simplified drawing, CC0)">
  <title>A4988 stepper driver top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Red 15 x 20 mm carrier, 8 pins per long side, black stick-on heatsink on the chip, brass current trimmer.
    Left column top to bottom: ENABLE MS1 MS2 MS3 RESET SLEEP STEP DIR. Right: VMOT GND 2B 2A 1A 1B VDD GND (Pololu order).
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="10" y="10" width="160" height="224" rx="4" fill="#c62828" stroke="#7f1717" stroke-width="2"/>
  <circle class="hole" cx="24" cy="42" r="6"/>
  <text class="pinlbl" x="36" y="45" text-anchor="start">ENABLE</text>
  <circle class="hole" cx="24" cy="64" r="6"/>
  <text class="pinlbl" x="36" y="67" text-anchor="start">MS1</text>
  <circle class="hole" cx="24" cy="86" r="6"/>
  <text class="pinlbl" x="36" y="89" text-anchor="start">MS2</text>
  <circle class="hole" cx="24" cy="108" r="6"/>
  <text class="pinlbl" x="36" y="111" text-anchor="start">MS3</text>
  <circle class="hole" cx="24" cy="130" r="6"/>
  <text class="pinlbl" x="36" y="133" text-anchor="start">RESET</text>
  <circle class="hole" cx="24" cy="152" r="6"/>
  <text class="pinlbl" x="36" y="155" text-anchor="start">SLEEP</text>
  <circle class="hole" cx="24" cy="174" r="6"/>
  <text class="pinlbl" x="36" y="177" text-anchor="start">STEP</text>
  <circle class="hole" cx="24" cy="196" r="6"/>
  <text class="pinlbl" x="36" y="199" text-anchor="start">DIR</text>
  <circle class="hole" cx="156" cy="42" r="6"/>
  <text class="pinlbl" x="144" y="45" text-anchor="end">VMOT</text>
  <circle class="hole gnd" cx="156" cy="64" r="6"/>
  <text class="pinlbl" x="144" y="67" text-anchor="end">GND</text>
  <circle class="hole" cx="156" cy="86" r="6"/>
  <text class="pinlbl" x="144" y="89" text-anchor="end">2B</text>
  <circle class="hole" cx="156" cy="108" r="6"/>
  <text class="pinlbl" x="144" y="111" text-anchor="end">2A</text>
  <circle class="hole" cx="156" cy="130" r="6"/>
  <text class="pinlbl" x="144" y="133" text-anchor="end">1A</text>
  <circle class="hole" cx="156" cy="152" r="6"/>
  <text class="pinlbl" x="144" y="155" text-anchor="end">1B</text>
  <circle class="hole" cx="156" cy="174" r="6"/>
  <text class="pinlbl" x="144" y="177" text-anchor="end">VDD</text>
  <circle class="hole gnd" cx="156" cy="196" r="6"/>
  <text class="pinlbl" x="144" y="199" text-anchor="end">GND</text>
  <rect class="chip" x="72" y="64" width="38" height="38" rx="2"/>
  <path d="M72 72 H110" stroke="#454545" stroke-width="1.4"/>
  <path d="M72 78 H110" stroke="#454545" stroke-width="1.4"/>
  <path d="M72 84 H110" stroke="#454545" stroke-width="1.4"/>
  <path d="M72 90 H110" stroke="#454545" stroke-width="1.4"/>
  <path d="M72 96 H110" stroke="#454545" stroke-width="1.4"/>
  <path d="M72 102 H110" stroke="#454545" stroke-width="1.4"/>
  <rect x="72" y="64" width="38" height="38" rx="2" fill="none" stroke="#6a6a6a" stroke-width="1"/>
  <rect class="smd" x="74" y="116" width="10" height="6" rx="1"/>
  <rect class="smd" x="98" y="116" width="10" height="6" rx="1"/>
  <rect class="smd" x="74" y="126" width="10" height="6" rx="1"/>
  <rect class="smd" x="98" y="126" width="6" height="4" rx="1"/>
  <rect x="82" y="42" width="18" height="12" rx="2" fill="#bdbdbd" stroke="#757575"/>
  <circle cx="91" cy="166" r="13" fill="#d4a84b" stroke="#8a6a1e" stroke-width="1.5"/>
  <path d="M82 166 H100 M91 157 V175" stroke="#7a5a14" stroke-width="2"/>
  <text class="label" x="91" y="205" text-anchor="middle" font-size="10" font-weight="bold">A4988</text>
</svg>
