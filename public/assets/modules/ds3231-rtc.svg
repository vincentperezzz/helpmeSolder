<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 294 180" width="294" height="180" role="img" aria-label="DS3231 RTC module top view (original simplified drawing, CC0)">
  <title>DS3231 RTC module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Blue ZS-042 board: DS3231 SOIC-16, AT24C32 EEPROM, CR2032 holder, power LED.
    Left header top to bottom: 32K SQW SCL SDA VCC GND (wired). The right header (SCL SDA VCC GND) carries the same signals and is drawn but not wired.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="10" y="10" width="274" height="160" rx="6" fill="#1f4fa8" stroke="#143c80" stroke-width="2"/>
  <circle cx="24" cy="24" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.2"/>
  <circle cx="24" cy="156" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.2"/>
  <rect x="17" y="36" width="18" height="108" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="26" cy="45" r="6"/>
  <text class="pinlbl" x="40" y="48" text-anchor="start" style="font-size:7.5px">32K</text>
  <circle class="hole" cx="26" cy="63" r="6"/>
  <text class="pinlbl" x="40" y="66" text-anchor="start" style="font-size:7.5px">SQW</text>
  <circle class="hole" cx="26" cy="81" r="6"/>
  <text class="pinlbl" x="40" y="84" text-anchor="start" style="font-size:7.5px">SCL</text>
  <circle class="hole" cx="26" cy="99" r="6"/>
  <text class="pinlbl" x="40" y="102" text-anchor="start" style="font-size:7.5px">SDA</text>
  <circle class="hole" cx="26" cy="117" r="6"/>
  <text class="pinlbl" x="40" y="120" text-anchor="start" style="font-size:7.5px">VCC</text>
  <circle class="hole gnd" cx="26" cy="135" r="6"/>
  <text class="pinlbl" x="40" y="138" text-anchor="start" style="font-size:7.5px">GND</text>
  <rect x="261" y="54" width="18" height="72" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="270" cy="63" r="6"/>
  <text class="pinlbl muted" x="256" y="66" text-anchor="end" style="font-size:7px">SCL</text>
  <circle class="hole" cx="270" cy="81" r="6"/>
  <text class="pinlbl muted" x="256" y="84" text-anchor="end" style="font-size:7px">SDA</text>
  <circle class="hole" cx="270" cy="99" r="6"/>
  <text class="pinlbl muted" x="256" y="102" text-anchor="end" style="font-size:7px">VCC</text>
  <circle class="hole gnd" cx="270" cy="117" r="6"/>
  <text class="pinlbl muted" x="256" y="120" text-anchor="end" style="font-size:7px">GND</text>
  <g>
    <rect class="chip" x="68" y="48" width="54" height="38" rx="1.5"/>
    <circle cx="72" cy="52" r="1.3" fill="#555"/>
    <text class="label" x="95" y="69" text-anchor="middle" font-size="7">DS3231</text>
  </g>
  <rect x="71" y="44" width="2.4" height="4" fill="#b0bec5"/><rect x="71" y="86" width="2.4" height="4" fill="#b0bec5"/>
  <rect x="77" y="44" width="2.4" height="4" fill="#b0bec5"/><rect x="77" y="86" width="2.4" height="4" fill="#b0bec5"/>
  <rect x="83" y="44" width="2.4" height="4" fill="#b0bec5"/><rect x="83" y="86" width="2.4" height="4" fill="#b0bec5"/>
  <rect x="89" y="44" width="2.4" height="4" fill="#b0bec5"/><rect x="89" y="86" width="2.4" height="4" fill="#b0bec5"/>
  <rect x="95" y="44" width="2.4" height="4" fill="#b0bec5"/><rect x="95" y="86" width="2.4" height="4" fill="#b0bec5"/>
  <rect x="101" y="44" width="2.4" height="4" fill="#b0bec5"/><rect x="101" y="86" width="2.4" height="4" fill="#b0bec5"/>
  <rect x="107" y="44" width="2.4" height="4" fill="#b0bec5"/><rect x="107" y="86" width="2.4" height="4" fill="#b0bec5"/>
  <rect x="113" y="44" width="2.4" height="4" fill="#b0bec5"/><rect x="113" y="86" width="2.4" height="4" fill="#b0bec5"/>
  <rect class="chip" x="68" y="108" width="30" height="16" rx="1.5"/>
  <text class="label" x="83" y="119" text-anchor="middle" style="font-size:5.5px">24C32</text>
  <rect class="smd" x="106" y="108" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="106" y="116" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="106" y="124" width="6" height="4" rx="0.6"/>
  <circle cx="120" cy="143" r="3.2" fill="#ef5350" stroke="#00000055" stroke-width="0.6"/>

  <text class="label" x="70" y="146" text-anchor="middle" style="font-size:7px">ZS-042</text>
  <circle cx="186" cy="90" r="52" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <circle cx="186" cy="90" r="43" fill="#b0bec5" stroke="#78909c" stroke-width="1"/>
  <text class="label" x="186" y="86" text-anchor="middle" style="font-size:10px;fill:#37474f">CR2032</text>
  <text class="label" x="186" y="100" text-anchor="middle" style="font-size:8px;fill:#37474f">+ 3V</text>
  <rect x="130" y="82" width="8" height="16" rx="1" fill="#90a4ae"/>
</svg>
