<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 252" width="200" height="252" role="img" aria-label="Coin vibration motor top view (original simplified drawing, CC0)">
  <title>Coin vibration motor top view (original simplified drawing, CC0)</title>
