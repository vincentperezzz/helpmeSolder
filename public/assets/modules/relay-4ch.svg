<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 353.5 263.5" width="353.5" height="263.5" role="img" aria-label="4-channel relay module top view (original simplified drawing, CC0)">
  <title>4-channel relay module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Blue board, 4 blue SRD-05VDC relay cubes, optocouplers and LEDs. Screw terminals along the top edge, each NO COM NC.
    Control header along the bottom, left to right: GND IN1 IN2 IN3 IN4 VCC, then the JD-VCC / VCC / GND jumper pins with the yellow jumper cap fitted on JD-VCC and VCC.
    Printed pin order and terminal order differ a little between makers.
  -->
