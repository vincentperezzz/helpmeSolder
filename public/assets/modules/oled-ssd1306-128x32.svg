<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 116" width="324" height="116" role="img" aria-label="OLED SSD1306 128x32 (I2C), top view">
  <title>OLED SSD1306 128x32 (I2C), top view</title>
  <!--
    0.91 inch SSD1306 OLED breakout, 38 x 12 mm blue board, about 8 units per mm.
    4-pin header on the left short edge, top to bottom GND, VCC, SCL, SDA (the usual silkscreen order).
    Some boards use a black PCB or the SSD1315 chip; layout is the same.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="8" y="8" width="308" height="100" rx="6" fill="#0d47a1" stroke="#082f6b" stroke-width="2"/>
  <rect x="13" y="20" width="18" height="76" rx="2" fill="#1b1b1b"/>
  <circle class="hole gnd" cx="22" cy="31" r="6"/>
  <text class="pinlbl" x="34" y="34" text-anchor="start">GND</text>
  <circle class="hole" cx="22" cy="49" r="6"/>
  <text class="pinlbl" x="34" y="52" text-anchor="start">VCC</text>
  <circle class="hole" cx="22" cy="67" r="6"/>
  <text class="pinlbl" x="34" y="70" text-anchor="start">SCL</text>
  <circle class="hole" cx="22" cy="85" r="6"/>
  <text class="pinlbl" x="34" y="88" text-anchor="start">SDA</text>
  <rect x="72" y="14" width="234" height="88" rx="2" fill="#15171c" stroke="#05060a" stroke-width="1.5"/>
  <rect x="92" y="36" width="180" height="45" fill="#05060a" stroke="#242833" stroke-width="0.8"/>
  <text class="label" x="182" y="63.5" text-anchor="middle" font-size="15" style="fill:#d6ecff" opacity="0.92">0.91 OLED</text>

  <polygon points="72,102 189,14 240.5,14 123.5,102" fill="#fff" opacity="0.07"/>
  <polygon points="142.2,102 247.5,14 263.9,14 158.6,102" fill="#fff" opacity="0.05"/>
</svg>
