<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 345" width="195" height="345" role="img" aria-label="E-paper 1.54 inch 200x200 (SPI), front view">
  <title>E-paper 1.54 inch 200x200 (SPI), front view</title>
  <!--
    1.54 inch e-paper panel (200x200) drawn portrait, with the amber flexible tail running to a small adapter board.
    Adapter board: FPC connector, DC/DC inductor and passives, 8-pin header along the bottom edge in the usual order VCC, GND, DIN, CLK, CS, DC, RST, BUSY.
    On the real module the tail folds the board behind the panel; it is shown below it so the header is visible.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="45" y="205" width="105" height="48" fill="#d9962b" stroke="#a86d12" stroke-width="1"/>
  <rect x="51" y="229" width="6.4" height="16" fill="#f2c75c"/>
  <rect x="62.6" y="229" width="6.4" height="16" fill="#f2c75c"/>
  <rect x="74.3" y="229" width="6.4" height="16" fill="#f2c75c"/>
  <rect x="85.9" y="229" width="6.4" height="16" fill="#f2c75c"/>
  <rect x="97.5" y="229" width="6.4" height="16" fill="#f2c75c"/>
  <rect x="109.1" y="229" width="6.4" height="16" fill="#f2c75c"/>
  <rect x="120.8" y="229" width="6.4" height="16" fill="#f2c75c"/>
  <rect x="132.4" y="229" width="6.4" height="16" fill="#f2c75c"/>
  <rect x="10" y="10" width="175" height="205" rx="3" fill="#e9e7df" stroke="#a7a498" stroke-width="1.5"/>
  <rect x="19" y="20" width="158" height="158" fill="#cfccc2"/>
  <rect x="22" y="23" width="152" height="152" fill="#f4f3ee" stroke="#3a3a37" stroke-width="1"/>
  <rect x="36" y="56.4" width="105.4" height="6.8" fill="#6d6d68" opacity="0.55"/>
  <rect x="36" y="83.8" width="76.9" height="6.8" fill="#6d6d68" opacity="0.55"/>
  <rect x="36" y="111.2" width="105.4" height="6.8" fill="#6d6d68" opacity="0.55"/>
  <circle cx="148" cy="47" r="9" fill="#2a2a28" opacity="0.7"/>
  <text class="label" x="97.5" y="207" text-anchor="middle" font-size="6.5" style="fill:#6e6b60" opacity="1">1.54 inch e-Paper</text>
  <rect x="10" y="231" width="175" height="104" rx="4" fill="#1565c0" stroke="#0b3d82" stroke-width="2"/>
  <circle cx="21" cy="243" r="3" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="174" cy="243" r="3" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <rect x="41" y="239" width="113" height="13" rx="1.5" fill="#1b1b1b" stroke="#000"/>
  <rect x="44" y="239" width="107" height="5" fill="#e7e2d3"/>
  <rect class="smd" x="30" y="261" width="8" height="5" rx="0.8"/>
  <rect class="smd" x="42" y="261" width="8" height="5" rx="0.8"/>
  <rect class="smd" x="54" y="261" width="8" height="5" rx="0.8"/>
  <rect x="131" y="258" width="16" height="14" rx="1.5" fill="#222" stroke="#000"/>
  <rect class="smd" x="153" y="261" width="8" height="5" rx="0.8"/>
  <rect class="smd" x="163" y="261" width="5" height="8" rx="0.8"/>
  <rect x="85.5" y="259" width="7" height="7" rx="1" fill="#444"/>
  <rect x="37.5" y="311" width="120" height="18" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="48.5" cy="320" r="5"/>
  <text class="pinlbl" x="48.5" y="306" transform="rotate(-90 48.5 306)" text-anchor="end" dy="3" font-size="7.5">VCC</text>
  <circle class="hole gnd" cx="62.5" cy="320" r="5"/>
  <text class="pinlbl" x="62.5" y="306" transform="rotate(-90 62.5 306)" text-anchor="end" dy="3" font-size="7.5">GND</text>
  <circle class="hole" cx="76.5" cy="320" r="5"/>
  <text class="pinlbl" x="76.5" y="306" transform="rotate(-90 76.5 306)" text-anchor="end" dy="3" font-size="7.5">DIN</text>
  <circle class="hole" cx="90.5" cy="320" r="5"/>
  <text class="pinlbl" x="90.5" y="306" transform="rotate(-90 90.5 306)" text-anchor="end" dy="3" font-size="7.5">CLK</text>
  <circle class="hole" cx="104.5" cy="320" r="5"/>
  <text class="pinlbl" x="104.5" y="306" transform="rotate(-90 104.5 306)" text-anchor="end" dy="3" font-size="7.5">CS</text>
  <circle class="hole" cx="118.5" cy="320" r="5"/>
  <text class="pinlbl" x="118.5" y="306" transform="rotate(-90 118.5 306)" text-anchor="end" dy="3" font-size="7.5">DC</text>
  <circle class="hole" cx="132.5" cy="320" r="5"/>
  <text class="pinlbl" x="132.5" y="306" transform="rotate(-90 132.5 306)" text-anchor="end" dy="3" font-size="7.5">RST</text>
  <circle class="hole" cx="146.5" cy="320" r="5"/>
  <text class="pinlbl" x="146.5" y="306" transform="rotate(-90 146.5 306)" text-anchor="end" dy="3" font-size="7.5">BUSY</text>
</svg>
