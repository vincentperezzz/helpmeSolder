<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 310" width="200" height="310" role="img" aria-label="NEO-6M GPS module top view (original simplified drawing, CC0)">
  <title>NEO-6M GPS module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Blue GY-GPS6MV2 style board: 4-pin header on the short edge, u-blox chip, backup battery, status LED, ceramic patch antenna.
    Header left to right: VCC, RX, TX, GND.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="10" y="10" width="180" height="290" rx="6" fill="#1f4fa8" stroke="#143c80" stroke-width="2"/>
  <circle cx="22" cy="22" r="4.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.2"/>
  <circle cx="178" cy="22" r="4.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.2"/>
  <circle cx="22" cy="288" r="4.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.2"/>
  <circle cx="178" cy="288" r="4.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.2"/>
  <rect x="62" y="25" width="76" height="18" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="73" cy="34" r="6"/>
  <text class="pinlbl" x="73" y="48" dy="3" text-anchor="start" style="font-size:7.5px" transform="rotate(90 73 48)">VCC</text>
  <circle class="hole" cx="91" cy="34" r="6"/>
  <text class="pinlbl" x="91" y="48" dy="3" text-anchor="start" style="font-size:7.5px" transform="rotate(90 91 48)">RX</text>
  <circle class="hole" cx="109" cy="34" r="6"/>
  <text class="pinlbl" x="109" y="48" dy="3" text-anchor="start" style="font-size:7.5px" transform="rotate(90 109 48)">TX</text>
  <circle class="hole gnd" cx="127" cy="34" r="6"/>
  <text class="pinlbl" x="127" y="48" dy="3" text-anchor="start" style="font-size:7.5px" transform="rotate(90 127 48)">GND</text>
  <g>
    <rect class="chip" x="83" y="86" width="34" height="34" rx="1.5"/>
    <circle cx="87" cy="90" r="1.3" fill="#555"/>
    <text class="label" x="100" y="105" text-anchor="middle" font-size="6.5">u-blox 6</text>
  </g>
  <rect x="28" y="90" width="38" height="30" rx="8" fill="#2a2a2a" stroke="#000"/>
  <text class="label" x="47" y="108" text-anchor="middle" style="font-size:7px">BAT</text>
  <rect class="chip" x="132" y="88" width="26" height="14" rx="1.5"/>
  <text class="label" x="145" y="98.5" text-anchor="middle" style="font-size:5px">24C32</text>
  <rect class="smd" x="130" y="108" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="140" y="108" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="72" y="126" width="6" height="4" rx="0.6"/>
  <circle cx="158" cy="124" r="3.2" fill="#ef5350" stroke="#00000055" stroke-width="0.6"/>
  <text class="label" x="158" y="135" text-anchor="middle" font-size="6">PPS</text>
  <text class="label" x="100" y="136" text-anchor="middle" style="font-size:7px">GY-GPS6MV2</text>
  <rect x="30" y="142" width="140" height="140" rx="3" fill="#e6d9a8" stroke="#a99455" stroke-width="1.5"/>
  <rect x="48" y="160" width="104" height="104" rx="2" fill="#f4ecc4" stroke="#c9b777" stroke-width="1"/>
  <circle cx="82" cy="196" r="3" fill="#8d6e3f"/>
</svg>
