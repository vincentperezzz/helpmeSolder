<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" width="300" height="290" role="img" aria-label="Arcade button with LED rear view (original simplified drawing, CC0)">
  <title>Arcade button with LED rear view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    Seen from the back: lamp holder with LED + and LED - tabs, microswitch with COM and NO tabs (the NC tab is left out).
    Tab order differs between brands; check the + mark on the lamp tab.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <circle cx="150" cy="106" r="90" fill="#455a64" stroke="#263238" stroke-width="2"/>
  <circle cx="150" cy="106" r="76" fill="none" stroke="#78909c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="150" cy="106" r="60" fill="#37474f" stroke="#263238" stroke-width="1.5"/>
  <rect x="60" y="120" width="64" height="48" rx="4" fill="#111111" stroke="#000" stroke-width="1"/>
  <rect x="150" y="120" width="90" height="48" rx="4" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
  <text class="label" x="92" y="150" text-anchor="middle" font-size="8">LAMP</text>
  <text class="label" x="195" y="150" text-anchor="middle" font-size="7">MICROSWITCH</text>
  <rect x="64" y="168" width="12" height="84" rx="2" fill="#cfd8dc" stroke="#607d8b" stroke-width="1"/>
  <circle cx="70" cy="242" r="3.2" fill="#37474f" stroke="#263238" stroke-width="0.8"/>
  <text class="label" x="70" y="270" text-anchor="middle" font-size="8" style="fill:#78909c">LED +</text>
  <rect x="104" y="168" width="12" height="84" rx="2" fill="#cfd8dc" stroke="#607d8b" stroke-width="1"/>
  <circle cx="110" cy="242" r="3.2" fill="#37474f" stroke="#263238" stroke-width="0.8"/>
  <text class="label" x="110" y="270" text-anchor="middle" font-size="8" style="fill:#78909c">LED -</text>
  <rect x="166" y="168" width="12" height="84" rx="2" fill="#cfd8dc" stroke="#607d8b" stroke-width="1"/>
  <circle cx="172" cy="242" r="3.2" fill="#37474f" stroke="#263238" stroke-width="0.8"/>
  <text class="label" x="172" y="270" text-anchor="middle" font-size="8" style="fill:#78909c">COM</text>
  <rect x="208" y="168" width="12" height="84" rx="2" fill="#cfd8dc" stroke="#607d8b" stroke-width="1"/>
  <circle cx="214" cy="242" r="3.2" fill="#37474f" stroke="#263238" stroke-width="0.8"/>
  <text class="label" x="214" y="270" text-anchor="middle" font-size="8" style="fill:#78909c">NO</text>
</svg>
