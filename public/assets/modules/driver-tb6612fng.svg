<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 216" width="170" height="216" role="img" aria-label="TB6612FNG motor driver breakout top view (original simplified drawing, CC0)">
  <title>TB6612FNG motor driver breakout top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Red breakout, 8 pins per side. Left top to bottom: VM VCC GND AO1 AO2 BO2 BO1 GND. Right: PWMA AIN2 AIN1 STBY BIN1 BIN2 PWMB GND.
    The catalog has one GND pin; it is wired to the first GND (left, third from top). The other GND pins are not wired.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="10" y="10" width="150" height="196" rx="4" fill="#c62828" stroke="#7f1717" stroke-width="2"/>
  <circle class="hole" cx="24" cy="42" r="6"/>
  <text class="pinlbl" x="36" y="45" text-anchor="start">VM</text>
  <circle class="hole" cx="24" cy="62.3" r="6"/>
  <text class="pinlbl" x="36" y="65.3" text-anchor="start">VCC</text>
  <circle class="hole gnd" cx="24" cy="82.6" r="6"/>
  <text class="pinlbl" x="36" y="85.6" text-anchor="start">GND</text>
  <circle class="hole" cx="24" cy="102.9" r="6"/>
  <text class="pinlbl" x="36" y="105.9" text-anchor="start">AO1</text>
  <circle class="hole" cx="24" cy="123.2" r="6"/>
  <text class="pinlbl" x="36" y="126.2" text-anchor="start">AO2</text>
  <circle class="hole" cx="24" cy="143.5" r="6"/>
  <text class="pinlbl" x="36" y="146.5" text-anchor="start">BO2</text>
  <circle class="hole" cx="24" cy="163.8" r="6"/>
  <text class="pinlbl" x="36" y="166.8" text-anchor="start">BO1</text>
  <circle class="hole gnd" cx="24" cy="184.1" r="6"/>
  <text class="pinlbl" x="36" y="187.1" text-anchor="start">GND</text>
  <circle class="hole" cx="146" cy="42" r="6"/>
  <text class="pinlbl" x="134" y="45" text-anchor="end">PWMA</text>
  <circle class="hole" cx="146" cy="62.3" r="6"/>
  <text class="pinlbl" x="134" y="65.3" text-anchor="end">AIN2</text>
  <circle class="hole" cx="146" cy="82.6" r="6"/>
  <text class="pinlbl" x="134" y="85.6" text-anchor="end">AIN1</text>
  <circle class="hole" cx="146" cy="102.9" r="6"/>
  <text class="pinlbl" x="134" y="105.9" text-anchor="end">STBY</text>
  <circle class="hole" cx="146" cy="123.2" r="6"/>
  <text class="pinlbl" x="134" y="126.2" text-anchor="end">BIN1</text>
  <circle class="hole" cx="146" cy="143.5" r="6"/>
  <text class="pinlbl" x="134" y="146.5" text-anchor="end">BIN2</text>
  <circle class="hole" cx="146" cy="163.8" r="6"/>
  <text class="pinlbl" x="134" y="166.8" text-anchor="end">PWMB</text>
  <circle class="hole gnd" cx="146" cy="184.1" r="6"/>
  <text class="pinlbl" x="134" y="187.1" text-anchor="end">GND</text>
  <rect class="chip" x="76" y="62" width="28" height="56" rx="2"/>
  <circle cx="82" cy="68" r="1.8" fill="#666"/>
  <text class="label" x="90" y="92" text-anchor="middle" font-size="7" transform="rotate(-90 90 92)">TB6612FNG</text>
  <rect x="74" y="130" width="14" height="14" rx="3" fill="#cfd8dc" stroke="#78909c"/>
  <rect x="74" y="130" width="14" height="4" fill="#546e7a"/>
  <rect class="smd" x="94" y="132" width="9" height="5" rx="1"/>
  <rect class="smd" x="94" y="142" width="9" height="5" rx="1"/>
  <rect class="smd" x="76" y="152" width="9" height="5" rx="1"/>
  <rect class="smd" x="94" y="152" width="9" height="5" rx="1"/>
  <text class="label" x="90" y="190" text-anchor="middle" font-size="7">MOTOR DRIVER</text>
</svg>
