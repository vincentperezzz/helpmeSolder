<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300" role="img" aria-label="TP4056 USB-C LiPo charger board top view (original simplified drawing, CC0)">
  <title>TP4056 USB-C LiPo charger board top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    Blue board: USB-C at the top, IN+ / IN- pads at the top corners, red CHRG and green STDBY LEDs, TP4056 + DW01 + 8205A protection chips.
    Bottom pads left to right: OUT+, B+, B-, OUT- (OUT = protected load output, B = battery). Pad order differs slightly between sellers.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="10" y="30" width="180" height="266" rx="6" fill="#1b66c9" stroke="#0f4590" stroke-width="2"/>
  <rect x="64" y="4" width="72" height="42" rx="12" fill="#cfd8dc" stroke="#546e7a" stroke-width="2"/>
  <rect x="80" y="12" width="40" height="8" rx="4" fill="#37474f"/>
  <rect x="86" y="14" width="28" height="4" rx="2" fill="#90a4ae"/>
  <circle cx="32" cy="60" r="9" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <circle class="hole" cx="32" cy="60" r="4.5"/>
  <text x="32" y="82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#eceff1" font-weight="bold">IN+</text>
  <circle cx="168" cy="60" r="9" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <circle class="hole" cx="168" cy="60" r="4.5"/>
  <text x="168" y="82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#eceff1" font-weight="bold">IN-</text>
  <circle cx="34" cy="272" r="9" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <circle class="hole" cx="34" cy="272" r="4.5"/>
  <text x="34" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#eceff1" font-weight="bold">OUT+</text>
  <circle cx="78" cy="272" r="9" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <circle class="hole" cx="78" cy="272" r="4.5"/>
  <text x="78" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#eceff1" font-weight="bold">B+</text>
  <circle cx="122" cy="272" r="9" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <circle class="hole" cx="122" cy="272" r="4.5"/>
  <text x="122" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#eceff1" font-weight="bold">B-</text>
  <circle cx="166" cy="272" r="9" fill="#d9b44a" stroke="#a07d1c" stroke-width="1"/>
  <circle class="hole" cx="166" cy="272" r="4.5"/>
  <text x="166" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#eceff1" font-weight="bold">OUT-</text>
  <rect x="24" y="100" width="16" height="9" rx="1.5" fill="#ef5350" stroke="#7f0000"/>
  <text x="46" y="108" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#eceff1">CHRG</text>
  <rect x="24" y="120" width="16" height="9" rx="1.5" fill="#66bb6a" stroke="#1b5e20"/>
  <text x="46" y="128" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#eceff1">STDBY</text>
  <rect class="chip" x="96" y="92" width="62" height="40" rx="1.5"/>
  <circle cx="102" cy="98" r="1.8" fill="#555"/>
  <text x="127" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#eceff1">TP4056</text>
  <rect x="100" y="144" width="14" height="8" fill="#d7ccc8" stroke="#6d4c41"/>
  <rect x="128" y="144" width="14" height="8" fill="#d7ccc8" stroke="#6d4c41"/>
  <rect class="chip" x="62" y="176" width="24" height="16" rx="1.5"/>
  <text x="74" y="187" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="5.5" fill="#eceff1">DW01</text>
  <rect class="chip" x="108" y="174" width="38" height="20" rx="1.5"/>
  <text x="127" y="187" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="6.5" fill="#eceff1">8205A</text>
  <rect x="34" y="180" width="14" height="8" fill="#d7ccc8" stroke="#6d4c41"/>
  <rect x="154" y="180" width="14" height="8" fill="#d7ccc8" stroke="#6d4c41"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#eceff1">TYPE-C  1A  LiPo</text>
</svg>
