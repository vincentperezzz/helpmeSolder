<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180" role="img" aria-label="Electrolytic capacitor 10µF (original simplified drawing, CC0)">
  <title>Electrolytic capacitor 10µF (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    Radial electrolytic can: the white stripe with minus signs marks the negative leg; the + leg is longer.
    Leg 1 = + (long leg, right), leg 2 = - (stripe side, left). Value and voltage printed on the can.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
