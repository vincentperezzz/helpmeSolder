<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 266" width="264" height="266" role="img" aria-label="OLED SH1106 1.3 inch (I2C), top view">
  <title>OLED SH1106 1.3 inch (I2C), top view</title>
  <!--
    1.3 inch SH1106 OLED breakout, about 35 x 35 mm black board, about 7 units per mm.
    4-pin header along the top edge, left to right GND, VCC, SCL, SDA. Boards exist with the header on a side edge or in other colours; this is the common one.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="8" y="8" width="248" height="250" rx="6" fill="#1b1e24" stroke="#0a0b0e" stroke-width="2"/>
  <circle cx="22" cy="22" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="242" cy="22" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="22" cy="244" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="242" cy="244" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
  <rect x="94" y="21" width="76" height="18" rx="2" fill="#1b1b1b"/>
  <circle class="hole gnd" cx="105" cy="30" r="6"/>
  <text class="pinlbl" x="105" y="44" transform="rotate(90 105 44)" text-anchor="start" dy="3" font-size="7.5">GND</text>
  <circle class="hole" cx="123" cy="30" r="6"/>
  <text class="pinlbl" x="123" y="44" transform="rotate(90 123 44)" text-anchor="start" dy="3" font-size="7.5">VCC</text>
  <circle class="hole" cx="141" cy="30" r="6"/>
  <text class="pinlbl" x="141" y="44" transform="rotate(90 141 44)" text-anchor="start" dy="3" font-size="7.5">SCL</text>
  <circle class="hole" cx="159" cy="30" r="6"/>
  <text class="pinlbl" x="159" y="44" transform="rotate(90 159 44)" text-anchor="start" dy="3" font-size="7.5">SDA</text>
  <rect x="24" y="80" width="216" height="150" rx="2" fill="#15171c" stroke="#05060a" stroke-width="1.5"/>
  <rect x="36" y="112" width="192" height="92" fill="#05060a" stroke="#242833" stroke-width="0.8"/>
  <text class="label" x="132" y="156" text-anchor="middle" font-size="18" style="fill:#e8f4ff" opacity="0.92">1.3 OLED</text>
  <text class="label" x="132" y="176" text-anchor="middle" font-size="9" style="fill:#e8f4ff" opacity="0.8">SH1106 128x64</text>
  <polygon points="24,230 132,80 179.5,80 71.5,230" fill="#fff" opacity="0.07"/>
  <polygon points="88.8,230 186,80 201.1,80 103.9,230" fill="#fff" opacity="0.05"/>
</svg>
