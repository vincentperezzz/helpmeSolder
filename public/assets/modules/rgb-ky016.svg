<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 212" width="175" height="212" role="img" aria-label="KY-016 RGB LED module top view (original simplified drawing, CC0)">
  <title>KY-016 RGB LED module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Small green board with a clear 5 mm RGB LED and a 4-pin header along the bottom edge: R G B and - (common cathode GND).
    Some KY-016 boards print the order differently (for example G R B); follow the printed letters on your board.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="12" y="12" width="150" height="188" rx="5" fill="#2e7d32" stroke="#1b4d20" stroke-width="2"/>
  <circle cx="22" cy="22" r="5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2"/>
  <circle cx="152" cy="22" r="5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2"/>
  <circle cx="87" cy="76" r="38" fill="#e8f1ee" stroke="#9db8b0" stroke-width="1.5" opacity="0.95"/>
  <path d="M52 94 V104 H122 V94" fill="none" stroke="#9db8b0" stroke-width="1.2"/>
  <rect x="60" y="62" width="10" height="28" fill="#cfd8dc" opacity="0.8"/>
  <rect x="104" y="62" width="10" height="28" fill="#cfd8dc" opacity="0.8"/>
  <circle cx="87" cy="70" r="6" fill="#e53935" opacity="0.7"/>
  <circle cx="75" cy="86" r="6" fill="#43a047" opacity="0.7"/>
  <circle cx="99" cy="86" r="6" fill="#1e88e5" opacity="0.7"/>
  <rect class="smd" x="34" y="124" width="9" height="5" rx="1"/>
  <rect class="smd" x="82" y="124" width="9" height="5" rx="1"/>
  <rect class="smd" x="130" y="124" width="9" height="5" rx="1"/>
  <text class="label" x="87" y="148" text-anchor="middle" font-size="9" font-weight="bold">KY-016</text>
  <rect x="41" y="167" width="94" height="18" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="52" cy="176" r="6"/>
  <text class="label" x="52" y="164" text-anchor="middle" font-size="9">R</text>
  <circle class="hole" cx="76" cy="176" r="6"/>
  <text class="label" x="76" y="164" text-anchor="middle" font-size="9">G</text>
  <circle class="hole" cx="100" cy="176" r="6"/>
  <text class="label" x="100" y="164" text-anchor="middle" font-size="9">B</text>
  <circle class="hole gnd" style="stroke:#9e9e9e" cx="124" cy="176" r="6"/>
  <text class="label" x="124" y="164" text-anchor="middle" font-size="9">-</text>
</svg>
