  <circle cx="107" cy="44" r="3" fill="#555"/>
  <text class="label" x="125" y="130" text-anchor="middle" font-size="12" font-weight="bold" transform="rotate(90 125 130)">L293D</text>
  <text class="label" x="125" y="206" text-anchor="middle" font-size="7" opacity="0.7" transform="rotate(90 125 206)">DIP-16</text>
