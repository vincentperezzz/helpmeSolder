<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 232" width="210" height="232" role="img" aria-label="DFPlayer Mini MP3 module top view (original simplified drawing, CC0)">
  <title>DFPlayer Mini MP3 module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Black 20 x 20 mm board with the microSD holder at the top and 8 pins per side.
    Left top to bottom: VCC RX TX DAC_R DAC_L SPK_1 GND SPK_2. Right: BUSY USB- USB+ ADKEY2 ADKEY1 IO2 GND IO1.
    Pin 1 (VCC) is at the top left when the microSD slot faces up.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="10" y="10" width="190" height="212" rx="4" fill="#1b1b1b" stroke="#000" stroke-width="2"/>
  <circle class="hole" cx="24" cy="42" r="6"/>
  <text class="pinlbl" x="36" y="45" text-anchor="start">VCC</text>
  <circle class="hole" cx="24" cy="64.9" r="6"/>
  <text class="pinlbl" x="36" y="67.9" text-anchor="start">RX</text>
  <circle class="hole" cx="24" cy="87.8" r="6"/>
  <text class="pinlbl" x="36" y="90.8" text-anchor="start">TX</text>
  <circle class="hole" cx="24" cy="110.7" r="6"/>
  <text class="pinlbl" x="36" y="113.7" text-anchor="start">DAC_R</text>
  <circle class="hole" cx="24" cy="133.6" r="6"/>
  <text class="pinlbl" x="36" y="136.6" text-anchor="start">DAC_L</text>
  <circle class="hole" cx="24" cy="156.5" r="6"/>
  <text class="pinlbl" x="36" y="159.5" text-anchor="start">SPK_1</text>
  <circle class="hole gnd" style="stroke:#9e9e9e" cx="24" cy="179.4" r="6"/>
  <text class="pinlbl" x="36" y="182.4" text-anchor="start">GND</text>
  <circle class="hole" cx="24" cy="202.3" r="6"/>
  <text class="pinlbl" x="36" y="205.3" text-anchor="start">SPK_2</text>
  <circle class="hole" cx="186" cy="42" r="6"/>
  <text class="pinlbl" x="174" y="45" text-anchor="end">BUSY</text>
  <circle class="hole" cx="186" cy="64.9" r="6"/>
  <text class="pinlbl" x="174" y="67.9" text-anchor="end">USB-</text>
  <circle class="hole" cx="186" cy="87.8" r="6"/>
  <text class="pinlbl" x="174" y="90.8" text-anchor="end">USB+</text>
  <circle class="hole" cx="186" cy="110.7" r="6"/>
  <text class="pinlbl" x="174" y="113.7" text-anchor="end">ADKEY2</text>
  <circle class="hole" cx="186" cy="133.6" r="6"/>
  <text class="pinlbl" x="174" y="136.6" text-anchor="end">ADKEY1</text>
  <circle class="hole" cx="186" cy="156.5" r="6"/>
  <text class="pinlbl" x="174" y="159.5" text-anchor="end">IO2</text>
  <circle class="hole gnd" style="stroke:#9e9e9e" cx="186" cy="179.4" r="6"/>
  <text class="pinlbl" x="174" y="182.4" text-anchor="end">GND</text>
  <circle class="hole" cx="186" cy="202.3" r="6"/>
  <text class="pinlbl" x="174" y="205.3" text-anchor="end">IO1</text>
  <rect x="66" y="12" width="78" height="76" rx="2" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
  <rect x="72" y="14" width="66" height="12" rx="1" fill="#37474f"/>
  <path d="M72 40 H138 M72 56 H138" stroke="#b0bec5" stroke-width="1"/>
  <text x="105" y="68" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#37474f">microSD</text>
  <rect class="chip" x="82" y="104" width="42" height="42" rx="2" fill="#2a2a2a"/>
  <circle cx="89" cy="111" r="2" fill="#777"/>
  <text class="label" x="103" y="128" text-anchor="middle" font-size="6">DFPlayer</text>
  <rect class="chip" x="86" y="152" width="34" height="14" rx="1.5"/>
  <rect class="smd" x="70" y="170" width="9" height="5" rx="1"/>
  <rect class="smd" x="84" y="170" width="9" height="5" rx="1"/>
  <rect class="smd" x="98" y="170" width="9" height="5" rx="1"/>
  <rect class="smd" x="112" y="170" width="9" height="5" rx="1"/>
  <rect class="smd" x="70" y="182" width="9" height="5" rx="1"/>
  <rect class="smd" x="126" y="182" width="9" height="5" rx="1"/>
  <text class="label" x="103" y="208" text-anchor="middle" font-size="8" font-weight="bold">DFPlayer</text>
  <text class="label" x="103" y="217" text-anchor="middle" font-size="6">MINI</text>
</svg>
