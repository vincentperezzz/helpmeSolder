<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 116" width="370" height="116" role="img" aria-label="RGB 12 V LED strip segment top view (original simplified drawing, CC0)">
  <title>RGB 12 V LED strip segment top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified view of a 12 V analog RGB strip for HelpmeSolder wiring diagrams.
    One cuttable segment with three 5050 LEDs. The four solder pads at the left cut line are, top to bottom: 12V R G B.
  -->
