<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 290" width="220" height="290" role="img" aria-label="Rocker switch front view (original simplified drawing, CC0)">
  <title>Rocker switch front view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    Two-position rocker: red I/O rocker in a black bezel, two flat spade lugs on the back.
    Wires end on the spade lugs; the switch is not polarised.
  -->
