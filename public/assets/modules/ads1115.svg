<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 220" width="170" height="220" role="img" aria-label="ADS1115 ADC module top view (original simplified drawing, CC0)">
  <title>ADS1115 ADC module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Blue board with the tiny VSSOP-10 chip. Left edge top to bottom: VDD GND SCL SDA ADDR ALRT. Right edge: A0 A1 A2 A3.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="10" y="10" width="150" height="200" rx="6" fill="#1b57b5" stroke="#133e80" stroke-width="2"/>
  <circle cx="86" cy="22" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.2"/>
  <circle cx="86" cy="198" r="3.5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.2"/>
  <rect x="15" y="31" width="18" height="108" rx="2" fill="#1b1b1b"/>
  <rect x="137" y="31" width="18" height="72" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="24" cy="40" r="6"/>
  <text class="pinlbl" x="37" y="43" text-anchor="start" style="font-size:7.5px">VDD</text>
  <circle class="hole gnd" cx="24" cy="58" r="6"/>
  <text class="pinlbl" x="37" y="61" text-anchor="start" style="font-size:7.5px">GND</text>
  <circle class="hole" cx="24" cy="76" r="6"/>
  <text class="pinlbl" x="37" y="79" text-anchor="start" style="font-size:7.5px">SCL</text>
  <circle class="hole" cx="24" cy="94" r="6"/>
  <text class="pinlbl" x="37" y="97" text-anchor="start" style="font-size:7.5px">SDA</text>
  <circle class="hole" cx="24" cy="112" r="6"/>
  <text class="pinlbl" x="37" y="115" text-anchor="start" style="font-size:7.5px">ADDR</text>
  <circle class="hole" cx="24" cy="130" r="6"/>
  <text class="pinlbl" x="37" y="133" text-anchor="start" style="font-size:7.5px">ALRT</text>
  <circle class="hole" cx="146" cy="40" r="6"/>
  <text class="pinlbl" x="133" y="43" text-anchor="end" style="font-size:7.5px">A0</text>
  <circle class="hole" cx="146" cy="58" r="6"/>
  <text class="pinlbl" x="133" y="61" text-anchor="end" style="font-size:7.5px">A1</text>
  <circle class="hole" cx="146" cy="76" r="6"/>
  <text class="pinlbl" x="133" y="79" text-anchor="end" style="font-size:7.5px">A2</text>
  <circle class="hole" cx="146" cy="94" r="6"/>
  <text class="pinlbl" x="133" y="97" text-anchor="end" style="font-size:7.5px">A3</text>
  <rect class="chip" x="76" y="142" width="26" height="12" rx="1.5"/>
  <circle cx="80" cy="146" r="1.2" fill="#666"/>
  <text class="label" x="89" y="151.5" text-anchor="middle" style="font-size:4.6px">ADS1115</text>
  <rect class="smd" x="66" y="160" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="76" y="160" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="98" y="160" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="108" y="160" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="66" y="134" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="110" y="134" width="6" height="4" rx="0.6"/>
  <circle cx="112" cy="180" r="3.2" fill="#ef5350" stroke="#00000055" stroke-width="0.6"/>

  <text class="label" x="78" y="184" text-anchor="middle" style="font-size:8px">ADS1115</text>
  <text class="label" x="78" y="194" text-anchor="middle" style="font-size:6px;fill:#cfd8dc">16-BIT ADC</text>
</svg>
