<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 332" width="170" height="332" role="img" aria-label="MQ-135 air quality sensor module top view (original simplified drawing, CC0)">
  <title>MQ-135 air quality sensor module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Blue board: round metal-mesh sensor cap, LM393, threshold trimmer, power and output LEDs.
    Header left to right: VCC, GND, DO, AO (many boards print AO, DO, GND, VCC; check yours). All MQ boards look alike.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <defs><pattern id="mq135mesh" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#37474f"/><path d="M0 0 L4 4 M4 0 L0 4" stroke="#90a4ae" stroke-width="0.7"/></pattern></defs>
