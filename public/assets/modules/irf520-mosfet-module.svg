  <circle cx="64" cy="204" r="4" fill="#ef5350" stroke="#00000066"/>
  <text x="74" y="207" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#eceff1">PWR</text>
  <text x="170" y="214" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#eceff1">IRF520 MOSFET DRIVER</text>
  <circle cx="26" cy="214" r="5" fill="#f5f5f5" stroke="#c9a227" stroke-width="2.5"/>
</svg>
