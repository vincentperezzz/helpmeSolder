<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="340" height="240" role="img" aria-label="IRF520 MOSFET driver module top view (original simplified drawing, CC0)">
  <title>IRF520 MOSFET driver module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    Blue board: 3-pin control header (SIG, VCC, GND) on the left, TO-220 IRF520 with its metal tab in the middle,
    two 2-pole screw terminals on the right: VIN+/VIN- (load supply in) on top, V+/V- (to the load) below.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="2" y="2" width="336" height="236" rx="6" fill="#1f56b0" stroke="#143c80" stroke-width="2"/>
  <rect x="272" y="14" width="44" height="88" rx="2" fill="#1565c0" stroke="#0d3c7a"/>
  <circle cx="294" cy="36" r="13.2" fill="#cfd8dc" stroke="#546e7a"/>
  <path d="M285.2 36 H302.8" stroke="#546e7a" stroke-width="1.2"/>
  <circle cx="294" cy="80" r="13.2" fill="#cfd8dc" stroke="#546e7a"/>
  <path d="M285.2 80 H302.8" stroke="#546e7a" stroke-width="1.2"/>
  <rect x="272" y="130" width="44" height="88" rx="2" fill="#1565c0" stroke="#0d3c7a"/>
  <circle cx="294" cy="152" r="13.2" fill="#cfd8dc" stroke="#546e7a"/>
  <path d="M285.2 152 H302.8" stroke="#546e7a" stroke-width="1.2"/>
  <circle cx="294" cy="196" r="13.2" fill="#cfd8dc" stroke="#546e7a"/>
  <path d="M285.2 196 H302.8" stroke="#546e7a" stroke-width="1.2"/>
  <rect x="17" y="40" width="26" height="24" rx="2" fill="#1b1b1b"/>
  <circle class="hole" cx="30" cy="52" r="6"/>
  <text x="50" y="55" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#eceff1">SIG</text>
  <rect x="17" y="76" width="26" height="24" rx="2" fill="#1b1b1b"/>
  <circle class="hole pwr" cx="30" cy="88" r="6"/>
  <text x="50" y="91" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#eceff1">VCC</text>
  <rect x="17" y="112" width="26" height="24" rx="2" fill="#1b1b1b"/>
  <circle class="hole gnd" cx="30" cy="124" r="6"/>
  <text x="50" y="127" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#eceff1">GND</text>
  <text x="266" y="39" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#eceff1">VIN+</text>
  <text x="266" y="83" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#eceff1">VIN-</text>
  <text x="266" y="155" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#eceff1">V+</text>
  <text x="266" y="199" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#eceff1">V-</text>
  <rect x="96" y="85" width="30" height="6" fill="#cfd8dc" stroke="#607d8b"/>
  <rect x="96" y="107" width="30" height="6" fill="#cfd8dc" stroke="#607d8b"/>
  <rect x="96" y="129" width="30" height="6" fill="#cfd8dc" stroke="#607d8b"/>
