<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 132" width="260" height="132" role="img" aria-label="ACS712 current sensor module top view (original simplified drawing, CC0)">
  <title>ACS712 current sensor module top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Blue board: 2-pole screw terminal IP+ and IP- (the load current passes through it), ACS712 chip, 3-pin header VCC, OUT, GND.
    The range (05B, 20A, 30A) is printed on the chip; the drawing shows 05B.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="20" y="20" width="217" height="91" rx="5" fill="#1f56b0" stroke="#143c80" stroke-width="2"/>
  <rect x="24" y="30" width="40" height="72" rx="2" fill="#2a7de1" stroke="#0d3c7a"/>
  <circle cx="44" cy="48" r="12" fill="#cfd8dc" stroke="#546e7a"/>
  <path d="M36 48 H52" stroke="#546e7a" stroke-width="1.2"/>
  <circle cx="44" cy="84" r="12" fill="#cfd8dc" stroke="#546e7a"/>
  <path d="M36 84 H52" stroke="#546e7a" stroke-width="1.2"/>
  <text class="label" x="70" y="51" text-anchor="start" font-size="7.5">IP+</text>
  <text class="label" x="70" y="87" text-anchor="start" font-size="7.5">IP-</text>
  <rect x="112" y="38" width="3" height="6" rx="0" fill="#cfd8dc"/>
  <rect x="124" y="38" width="3" height="6" rx="0" fill="#cfd8dc"/>
  <rect x="136" y="38" width="3" height="6" rx="0" fill="#cfd8dc"/>
  <rect x="148" y="38" width="3" height="6" rx="0" fill="#cfd8dc"/>
  <rect x="112" y="90" width="3" height="6" rx="0" fill="#cfd8dc"/>
  <rect x="124" y="90" width="3" height="6" rx="0" fill="#cfd8dc"/>
  <rect x="136" y="90" width="3" height="6" rx="0" fill="#cfd8dc"/>
  <rect x="148" y="90" width="3" height="6" rx="0" fill="#cfd8dc"/>
  <rect x="108" y="44" width="46" height="46" rx="2" fill="#1a1a1a" stroke="#000" stroke-width="0.8"/>
  <circle cx="114" cy="50" r="1.4" fill="#555"/>
  <text class="label" x="131" y="64" text-anchor="middle" font-size="6.5">ACS712</text>
  <text class="label" x="131" y="76" text-anchor="middle" font-size="6.5">05B</text>
  <rect x="170" y="30" width="9" height="5" rx="1" fill="#ef5350" stroke="#00000066" stroke-width="0.6"/>
  <rect x="172.5" y="31.2" width="4" height="2.6" rx="1" fill="#ffffff88"/>
  <rect x="166" y="96" width="10" height="5" rx="0.8" fill="#212121" stroke="#000" stroke-width="0.5"/>
  <rect x="180" y="96" width="8" height="5" rx="0.8" fill="#c8a06a" stroke="#6d4c41" stroke-width="0.5"/>
  <circle cx="214" cy="47" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="214" cy="47" r="5"/>
  <text class="pinlbl" x="201" y="49.7" text-anchor="end" font-size="7.5">VCC</text>
  <circle cx="214" cy="65" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="214" cy="65" r="5"/>
  <text class="pinlbl" x="201" y="67.7" text-anchor="end" font-size="7.5">OUT</text>
  <circle cx="214" cy="83" r="8.5" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole gnd" cx="214" cy="83" r="5"/>
  <text class="pinlbl" x="201" y="85.7" text-anchor="end" font-size="7.5">GND</text>
</svg>
