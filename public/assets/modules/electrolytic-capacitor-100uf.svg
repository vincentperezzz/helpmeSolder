<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230" role="img" aria-label="Electrolytic capacitor 100µF (original simplified drawing, CC0)">
  <title>Electrolytic capacitor 100µF (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified drawing for HelpmeSolder wiring diagrams.
    Radial electrolytic can: the white stripe with minus signs marks the negative leg; the + leg is longer.
    Leg 1 = + (long leg, right), leg 2 = - (stripe side, left). Value and voltage printed on the can.
  -->
