<?xml version="1.0" encoding="UTF-8"?>
<!--
  Raspberry Pi 3 Model B+ top-down silhouette.
  Original artwork for HelpmeSolder. License: CC0.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280"
     role="img" aria-label="Raspberry Pi 3 Model B+ top view">
  <title>Raspberry Pi 3 Model B+</title>
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a9b4a"/>
      <stop offset="100%" stop-color="#286832"/>
    </linearGradient>
  </defs>
  <rect x="20" y="28" width="360" height="224" rx="8" fill="url(#pcb)" stroke="#1f5a28" stroke-width="2"/>
  <circle cx="40" cy="48" r="7" fill="#1a1a1a" stroke="#c9a227" stroke-width="1.5"/>
  <circle cx="360" cy="48" r="7" fill="#1a1a1a" stroke="#c9a227" stroke-width="1.5"/>
  <circle cx="40" cy="232" r="7" fill="#1a1a1a" stroke="#c9a227" stroke-width="1.5"/>
  <circle cx="360" cy="232" r="7" fill="#1a1a1a" stroke="#c9a227" stroke-width="1.5"/>
  <g id="gpio-header" fill="#d4af37">
    <g id="gpio-row-a">
      <circle cx="70" cy="50" r="2.6" data-pin="3V3" id="pin-3v3"/>
      <circle cx="82" cy="50" r="2.6"/><circle cx="94" cy="50" r="2.6"/>
      <circle cx="106" cy="50" r="2.6"/><circle cx="118" cy="50" r="2.6" data-pin="GND" id="pin-gnd"/>
      <circle cx="130" cy="50" r="2.6"/><circle cx="142" cy="50" r="2.6"/>
      <circle cx="154" cy="50" r="2.6" data-pin="GND"/><circle cx="166" cy="50" r="2.6"/>
      <circle cx="178" cy="50" r="2.6"/><circle cx="190" cy="50" r="2.6"/>
      <circle cx="202" cy="50" r="2.6"/><circle cx="214" cy="50" r="2.6" data-pin="GND"/>
      <circle cx="226" cy="50" r="2.6"/><circle cx="238" cy="50" r="2.6"/>
      <circle cx="250" cy="50" r="2.6"/><circle cx="262" cy="50" r="2.6"/>
      <circle cx="274" cy="50" r="2.6"/><circle cx="286" cy="50" r="2.6"/>
      <circle cx="298" cy="50" r="2.6" data-pin="GND"/>
    </g>
    <g id="gpio-row-b">
      <circle cx="70" cy="62" r="2.6" data-pin="5V" id="pin-5v"/>
      <circle cx="82" cy="62" r="2.6" data-pin="5V"/><circle cx="94" cy="62" r="2.6"/>
      <circle cx="106" cy="62" r="2.6" data-pin="GND"/><circle cx="118" cy="62" r="2.6"/>
      <circle cx="130" cy="62" r="2.6"/><circle cx="142" cy="62" r="2.6"/>
      <circle cx="154" cy="62" r="2.6"/><circle cx="166" cy="62" r="2.6"/>
      <circle cx="178" cy="62" r="2.6"/><circle cx="190" cy="62" r="2.6"/>
      <circle cx="202" cy="62" r="2.6"/><circle cx="214" cy="62" r="2.6"/>
      <circle cx="226" cy="62" r="2.6"/><circle cx="238" cy="62" r="2.6"/>
      <circle cx="250" cy="62" r="2.6"/><circle cx="262" cy="62" r="2.6" data-pin="GND"/>
      <circle cx="274" cy="62" r="2.6"/><circle cx="286" cy="62" r="2.6"/>
      <circle cx="298" cy="62" r="2.6"/>
    </g>
  </g>
  <g font-family="ui-monospace, monospace" font-size="8" fill="#fff8e1">
    <text x="58" y="42">3V3</text>
    <text x="58" y="76">5V</text>
    <text x="110" y="42">GND</text>
  </g>
  <g id="soc">
    <rect x="145" y="96" width="100" height="78" rx="3" fill="#1c1c1c" stroke="#0a0a0a"/>
    <rect x="155" y="106" width="80" height="58" rx="2" fill="#333"/>
    <text x="195" y="136" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#eee" font-weight="700">BCM2837</text>
    <text x="195" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#8bc34a">Pi 3B+</text>
  </g>
  <g id="hdmi">
    <rect x="100" y="228" width="52" height="22" rx="2" fill="#2a2a2a"/>
    <text x="126" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#e8f5e9">HDMI</text>
  </g>
  <g id="power-jack">
    <rect x="40" y="234" width="34" height="16" rx="3" fill="#333"/>
    <rect x="48" y="238" width="18" height="8" rx="1" fill="#bbb"/>
    <text x="57" y="224" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#e8f5e9">µUSB</text>
  </g>
  <g id="usb">
    <rect x="330" y="88" width="48" height="38" rx="2" fill="#c0c0c0" stroke="#555"/>
    <rect x="330" y="136" width="48" height="38" rx="2" fill="#c0c0c0" stroke="#555"/>
    <text x="354" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#222">USB</text>
  </g>
  <g id="ethernet">
    <rect x="330" y="190" width="48" height="34" rx="2" fill="#2f2f2f" stroke="#111"/>
    <rect x="338" y="198" width="32" height="18" rx="1" fill="#555"/>
    <text x="354" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#e8f5e9">ETH</text>
  </g>
  <rect x="250" y="100" width="40" height="24" rx="2" fill="#263238" stroke="#90a4ae"/>
  <text x="270" y="116" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#e8f5e9">WiFi</text>
  <text x="195" y="210" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1a3d20" font-weight="700">Pi 3B+</text>
</svg>
