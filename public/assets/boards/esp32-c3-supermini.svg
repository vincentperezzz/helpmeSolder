<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 270" width="220" height="270" role="img" aria-label="ESP32-C3 SuperMini top view (original simplified drawing, CC0)">
  <title>ESP32-C3 SuperMini top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Chip side, USB-C up: BOOT and RST buttons beside the connector, ESP32-C3FH4 in the middle,
    ceramic antenna and the red C3 mark at the bottom end. Left column 5-10, 20, 21; right column
    5V, G (GND), 3.3, 4-0. Clones can differ; check the silkscreen.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="30" y="44" width="160" height="206" rx="6" fill="#16181c" stroke="#000" stroke-width="2"/>
  <rect x="88" y="26" width="44" height="40" rx="6" fill="#d5d9dc" stroke="#7d868c" stroke-width="1.4"/>
  <rect x="95" y="32" width="30" height="12" rx="6" fill="#9aa3a8"/>
  <rect x="102" y="36" width="16" height="4" rx="2" fill="#5f686d"/>
  <rect x="73" y="82" width="14" height="12" rx="1.5" fill="#cfd3d6" stroke="#7d868c"/>
  <circle cx="80" cy="88" r="3.4" fill="#263238"/>
  <text class="label" x="80" y="103" text-anchor="middle" font-size="5.5">BOOT</text>
  <rect x="133" y="82" width="14" height="12" rx="1.5" fill="#cfd3d6" stroke="#7d868c"/>
  <circle cx="140" cy="88" r="3.4" fill="#263238"/>
  <text class="label" x="140" y="103" text-anchor="middle" font-size="5.5">RST</text>
  <circle cx="110" cy="96" r="2.6" fill="#ff5252" stroke="#7f0000" stroke-width="0.5"/>
  <text class="label" x="110" y="108" text-anchor="middle" font-size="5">LED</text>
  <rect x="94" y="116" width="32" height="12" rx="2" fill="#c8ccd0" stroke="#7d868c"/>
  <rect x="95" y="138" width="30" height="30" rx="1.5" fill="#1a1a1a" stroke="#000"/>
  <circle cx="100" cy="143" r="1.6" fill="#555"/>
  <text class="label" x="110" y="153" text-anchor="middle" font-size="5">ESP32</text>
  <text class="label" x="110" y="161" text-anchor="middle" font-size="5">C3FH4</text>
  <rect class="smd" x="72" y="128" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="72" y="136" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="142" y="128" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="142" y="136" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="78" y="172" width="6" height="4" rx="0.6"/>
  <rect class="smd" x="136" y="172" width="6" height="4" rx="0.6"/>
  <rect x="80" y="196" width="60" height="9" rx="2" fill="#e0d8c8" stroke="#8a7f68"/>
  <rect x="88" y="208" width="44" height="16" rx="2" fill="#d32f2f"/>
  <text x="110" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#ffffff">C3</text>
  <g id="headers">
    <circle class="hole" cx="44" cy="72" r="6"/>
    <text class="pinlbl" x="55" y="75" text-anchor="start">5</text>
    <circle class="hole" cx="44" cy="94" r="6"/>
    <text class="pinlbl" x="55" y="97" text-anchor="start">6</text>
    <circle class="hole" cx="44" cy="116" r="6"/>
    <text class="pinlbl" x="55" y="119" text-anchor="start">7</text>
    <circle class="hole" cx="44" cy="138" r="6"/>
    <text class="pinlbl" x="55" y="141" text-anchor="start">8</text>
    <circle class="hole" cx="44" cy="160" r="6"/>
    <text class="pinlbl" x="55" y="163" text-anchor="start">9</text>
    <circle class="hole" cx="44" cy="182" r="6"/>
    <text class="pinlbl" x="55" y="185" text-anchor="start">10</text>
    <circle class="hole" cx="44" cy="204" r="6"/>
    <text class="pinlbl" x="55" y="207" text-anchor="start">20</text>
    <circle class="hole" cx="44" cy="226" r="6"/>
    <text class="pinlbl" x="55" y="229" text-anchor="start">21</text>
    <circle class="hole pwr" cx="176" cy="72" r="6"/>
    <text class="pinlbl" x="165" y="75" text-anchor="end">5V</text>
    <circle class="hole gnd" cx="176" cy="94" r="6"/>
    <text class="pinlbl" x="165" y="97" text-anchor="end">GND</text>
    <circle class="hole" cx="176" cy="116" r="6"/>
    <text class="pinlbl" x="165" y="119" text-anchor="end">3.3</text>
    <circle class="hole" cx="176" cy="138" r="6"/>
    <text class="pinlbl" x="165" y="141" text-anchor="end">4</text>
    <circle class="hole" cx="176" cy="160" r="6"/>
    <text class="pinlbl" x="165" y="163" text-anchor="end">3</text>
    <circle class="hole" cx="176" cy="182" r="6"/>
    <text class="pinlbl" x="165" y="185" text-anchor="end">2</text>
    <circle class="hole" cx="176" cy="204" r="6"/>
    <text class="pinlbl" x="165" y="207" text-anchor="end">1</text>
    <circle class="hole" cx="176" cy="226" r="6"/>
    <text class="pinlbl" x="165" y="229" text-anchor="end">0</text>
  </g>
</svg>
