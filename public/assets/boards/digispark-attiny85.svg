<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 410" width="260" height="410" role="img" aria-label="Digispark ATtiny85 top view (original simplified drawing, CC0)">
  <title>Digispark ATtiny85 top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    Small blue board with a PCB tab that plugs straight into a USB-A port (the four gold fingers at the bottom).
    Drawn with P5, P4, P3 down the left edge, P0, P1, P2 down the right edge and VIN, GND, 5V across the bottom, next to the USB tab.
    Hole positions vary slightly between Digispark clones; most-common arrangement drawn here, please verify against a board in hand.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="64" y="301" width="132" height="110" rx="3" fill="#1565c0" stroke="#0d3c7a" stroke-width="2" />
  <rect x="82" y="313" width="16" height="88" rx="2" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8" />
  <rect x="107" y="313" width="16" height="88" rx="2" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8" />
  <rect x="132" y="313" width="16" height="88" rx="2" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8" />
  <rect x="157" y="313" width="16" height="88" rx="2" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8" />
  <text x="130" y="413" text-anchor="middle" font-family="ui-monospace, monospace" font-size="5" fill="#90caf9">USB-A tab</text>
  <rect x="28" y="30" width="204" height="275" rx="8" fill="#1565c0" stroke="#0d3c7a" stroke-width="2" />
  <g>
    <path d="M106 124V127 M106 173V176" stroke="#b0bec5" stroke-width="1.4"/>
    <path d="M122 124V127 M122 173V176" stroke="#b0bec5" stroke-width="1.4"/>
    <path d="M138 124V127 M138 173V176" stroke="#b0bec5" stroke-width="1.4"/>
    <path d="M154 124V127 M154 173V176" stroke="#b0bec5" stroke-width="1.4"/>
    <rect class="chip" x="98" y="127" width="64" height="46" rx="1"/>
    <circle cx="101.5" cy="130.5" r="1.1" fill="#555"/>
    <text x="130" y="153.9" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#eceff1">t85</text>
  </g>
  <text x="130" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#b0bec5">ATTINY85</text>
  <text x="130" y="116" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#eceff1" font-weight="bold">DIGISPARK</text>
  <rect x="185" y="105" width="10" height="6" rx="1" fill="#ef5350" stroke="#00000066" stroke-width="0.6"/>
  <text x="190" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="5.5" fill="#eceff1">P1</text>
  <rect x="69" y="215" width="10" height="6" rx="1" fill="#66bb6a" stroke="#00000066" stroke-width="0.6"/>
  <text x="74" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="5.5" fill="#eceff1">PWR</text>
  <rect class="chip" x="168" y="206" width="22" height="14" rx="1.5"/>
  <text x="179" y="232" text-anchor="middle" font-family="ui-monospace, monospace" font-size="5" fill="#eceff1">78L05</text>
  <rect x="90" y="230" width="24" height="8" rx="3" fill="#e0b050" stroke="#8d6e1b"/>
  <rect x="146" y="230" width="24" height="8" rx="3" fill="#e0b050" stroke="#8d6e1b"/>
  <rect class="smd" x="122" y="218" width="8" height="5" rx="0.6"/>
  <rect class="smd" x="132" y="218" width="8" height="5" rx="0.6"/>
  <circle cx="44" cy="66" r="8.4" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="44" cy="66" r="5"/>
  <text x="56" y="69.2" text-anchor="start" font-family="ui-monospace, monospace" font-size="8" fill="#eceff1">P5</text>
  <circle cx="44" cy="96" r="8.4" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="44" cy="96" r="5"/>
  <text x="56" y="99.2" text-anchor="start" font-family="ui-monospace, monospace" font-size="8" fill="#eceff1">P4</text>
  <circle cx="44" cy="126" r="8.4" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="44" cy="126" r="5"/>
  <text x="56" y="129.2" text-anchor="start" font-family="ui-monospace, monospace" font-size="8" fill="#eceff1">P3</text>
  <circle cx="216" cy="66" r="8.4" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="216" cy="66" r="5"/>
  <text x="204" y="69.2" text-anchor="end" font-family="ui-monospace, monospace" font-size="8" fill="#eceff1">P0</text>
  <circle cx="216" cy="96" r="8.4" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="216" cy="96" r="5"/>
  <text x="204" y="99.2" text-anchor="end" font-family="ui-monospace, monospace" font-size="8" fill="#eceff1">P1</text>
  <circle cx="216" cy="126" r="8.4" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole" cx="216" cy="126" r="5"/>
  <text x="204" y="129.2" text-anchor="end" font-family="ui-monospace, monospace" font-size="8" fill="#eceff1">P2</text>
  <circle cx="100" cy="281" r="8.4" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole pwr" cx="100" cy="281" r="5"/>
  <text x="100" y="268" transform="rotate(-90 100 268)" dy="3" font-family="ui-monospace, monospace" font-size="7.5" fill="#eceff1">VIN</text>
  <circle cx="130" cy="281" r="8.4" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole gnd" cx="130" cy="281" r="5"/>
  <text x="130" y="268" transform="rotate(-90 130 268)" dy="3" font-family="ui-monospace, monospace" font-size="7.5" fill="#eceff1">GND</text>
  <circle cx="160" cy="281" r="8.4" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
  <circle class="hole pwr" cx="160" cy="281" r="5"/>
  <text x="160" y="268" transform="rotate(-90 160 268)" dy="3" font-family="ui-monospace, monospace" font-size="7.5" fill="#eceff1">5V</text>
</svg>
