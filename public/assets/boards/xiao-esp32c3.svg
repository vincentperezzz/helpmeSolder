    <circle class="hole" cx="50" cy="64" r="4.5"/>
    <text class="pinlbl" x="61" y="67" text-anchor="start">D0</text>
    <rect x="38" y="81" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole" cx="50" cy="88" r="4.5"/>
    <text class="pinlbl" x="61" y="91" text-anchor="start">D1</text>
    <rect x="38" y="105" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole" cx="50" cy="112" r="4.5"/>
    <text class="pinlbl" x="61" y="115" text-anchor="start">D2</text>
    <rect x="38" y="129" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole" cx="50" cy="136" r="4.5"/>
    <text class="pinlbl" x="61" y="139" text-anchor="start">D3</text>
    <rect x="38" y="153" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole" cx="50" cy="160" r="4.5"/>
    <text class="pinlbl" x="61" y="163" text-anchor="start">D4</text>
    <rect x="38" y="177" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole" cx="50" cy="184" r="4.5"/>
    <text class="pinlbl" x="61" y="187" text-anchor="start">D5</text>
    <rect x="38" y="201" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole" cx="50" cy="208" r="4.5"/>
    <text class="pinlbl" x="61" y="211" text-anchor="start">D6</text>
    <rect x="186" y="57" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole pwr" cx="190" cy="64" r="4.5"/>
    <text class="pinlbl" x="179" y="67" text-anchor="end">5V</text>
    <rect x="186" y="81" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole gnd" cx="190" cy="88" r="4.5"/>
    <text class="pinlbl" x="179" y="91" text-anchor="end">GND</text>
    <rect x="186" y="105" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole v3" cx="190" cy="112" r="4.5"/>
    <text class="pinlbl" x="179" y="115" text-anchor="end">3V3</text>
    <rect x="186" y="129" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole" cx="190" cy="136" r="4.5"/>
    <text class="pinlbl" x="179" y="139" text-anchor="end">D10</text>
    <rect x="186" y="153" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole" cx="190" cy="160" r="4.5"/>
    <text class="pinlbl" x="179" y="163" text-anchor="end">D9</text>
    <rect x="186" y="177" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole" cx="190" cy="184" r="4.5"/>
    <text class="pinlbl" x="179" y="187" text-anchor="end">D8</text>
    <rect x="186" y="201" width="16" height="14" rx="3" fill="#d9b44a" stroke="#a07d1c" stroke-width="0.8"/>
    <circle class="hole" cx="190" cy="208" r="4.5"/>
    <text class="pinlbl" x="179" y="211" text-anchor="end">D7</text>
  </g>
</svg>
