<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="360" height="160" role="img" aria-label="Arduino Nano ESP32 top view (original simplified drawing, CC0)">
  <title>Arduino Nano ESP32 top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    45 x 18 mm Nano footprint, teal board, USB-C on the left, reset button and LEDs (ON, L on D13, RGB) near it,
    MP2322 buck converter and 16 MB flash, and the u-blox NORA-W106 (ESP32-S3) module with its PCB antenna at the far end.
    Drawn rotated 90 degrees from the usual upright view. Top row left to right: VIN, GND, B1, VBUS, A7..A0, B0, 3V3, D13.
    Bottom row: D1 (TX), D0 (RX), RST, GND, D2-D12. B0/B1/RST are drawn grey because the catalog does not wire them.
    PCB colour and exact part positions are from memory of the product photos; verify against a real board.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
