<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 424" width="260" height="424" role="img" aria-label="ESP32-C3-DevKitM-1 top view (original simplified drawing, CC0)">
  <title>ESP32-C3-DevKitM-1 top view (original simplified drawing, CC0)</title>
  <!--
    Original CC0 simplified top view for HelpmeSolder wiring diagrams.
    ESP32-C3-MINI-1 module at the top, micro-USB at the bottom.
    Header order from Espressif's published J1 / J3 pinout. GPIO18/19 (grey) are USB data.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
  </defs>
  <rect x="30" y="40" width="200" height="370" rx="8" fill="#1d2026" stroke="#0b0c0f" stroke-width="2"/>
  <path d="M106 50 V62 H118 V52 H130 V62 H142 V52 H154 V66" fill="none" stroke="#9e9e9e" stroke-width="2"/>
  <rect class="metal" x="98" y="68" width="64" height="74" rx="3"/>
  <text x="130" y="104" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#263238">ESP32-C3</text>
  <text x="130" y="117" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#37474f">MINI-1</text>
  <circle cx="130" cy="170" r="5" fill="#ffffff" stroke="#9e9e9e"/>
  <text class="label" x="130" y="186" text-anchor="middle" font-size="7">RGB</text>
  <text class="label" x="130" y="270" text-anchor="middle" font-size="8" transform="rotate(-90 130 270)">ESP32-C3-DevKitM-1</text>
  <rect class="btn" x="104" y="364" width="16" height="12" rx="2"/>
  <circle cx="112" cy="370" r="3" fill="#90a4ae"/>
  <text class="label" x="112" y="386" text-anchor="middle" font-size="7">BOOT</text>
  <rect class="btn" x="140" y="364" width="16" height="12" rx="2"/>
  <circle cx="148" cy="370" r="3" fill="#90a4ae"/>
  <text class="label" x="148" y="386" text-anchor="middle" font-size="7">RST</text>
  <rect class="usb" x="114" y="402" width="32" height="14" rx="3"/>
  <text class="label" x="130" y="398" text-anchor="middle" font-size="7">USB</text>
  <g id="headers">
    <circle class="hole gnd" cx="44" cy="82" r="6"/>
    <text class="pinlbl" x="55" y="85" text-anchor="start">GND</text>
    <circle class="hole v3" cx="44" cy="103" r="6"/>
    <text class="pinlbl" x="55" y="106" text-anchor="start">3V3</text>
    <circle class="hole v3" cx="44" cy="124" r="6"/>
    <text class="pinlbl" x="55" y="127" text-anchor="start">3V3</text>
    <circle class="hole" cx="44" cy="145" r="6"/>
    <text class="pinlbl" x="55" y="148" text-anchor="start">GPIO2</text>
    <circle class="hole" cx="44" cy="166" r="6"/>
    <text class="pinlbl" x="55" y="169" text-anchor="start">GPIO3</text>
    <circle class="hole gnd" cx="44" cy="187" r="6"/>
    <text class="pinlbl" x="55" y="190" text-anchor="start">GND</text>
    <circle class="hole" cx="44" cy="208" r="6"/>
    <text class="pinlbl" x="55" y="211" text-anchor="start">RST</text>
    <circle class="hole gnd" cx="44" cy="229" r="6"/>
    <text class="pinlbl" x="55" y="232" text-anchor="start">GND</text>
    <circle class="hole" cx="44" cy="250" r="6"/>
    <text class="pinlbl" x="55" y="253" text-anchor="start">GPIO0</text>
    <circle class="hole" cx="44" cy="271" r="6"/>
    <text class="pinlbl" x="55" y="274" text-anchor="start">GPIO1</text>
    <circle class="hole" cx="44" cy="292" r="6"/>
    <text class="pinlbl" x="55" y="295" text-anchor="start">GPIO10</text>
    <circle class="hole gnd" cx="44" cy="313" r="6"/>
    <text class="pinlbl" x="55" y="316" text-anchor="start">GND</text>
    <circle class="hole pwr" cx="44" cy="334" r="6"/>
    <text class="pinlbl" x="55" y="337" text-anchor="start">5V</text>
    <circle class="hole pwr" cx="44" cy="355" r="6"/>
    <text class="pinlbl" x="55" y="358" text-anchor="start">5V</text>
    <circle class="hole gnd" cx="44" cy="376" r="6"/>
    <text class="pinlbl" x="55" y="379" text-anchor="start">GND</text>
    <circle class="hole gnd" cx="216" cy="82" r="6"/>
    <text class="pinlbl" x="205" y="85" text-anchor="end">GND</text>
    <circle class="hole" cx="216" cy="103" r="6"/>
    <text class="pinlbl" x="205" y="106" text-anchor="end">TX</text>
    <circle class="hole" cx="216" cy="124" r="6"/>
    <text class="pinlbl" x="205" y="127" text-anchor="end">RX</text>
    <circle class="hole gnd" cx="216" cy="145" r="6"/>
    <text class="pinlbl" x="205" y="148" text-anchor="end">GND</text>
    <circle class="hole" cx="216" cy="166" r="6"/>
    <text class="pinlbl" x="205" y="169" text-anchor="end">GPIO9</text>
    <circle class="hole" cx="216" cy="187" r="6"/>
    <text class="pinlbl" x="205" y="190" text-anchor="end">GPIO8</text>
    <circle class="hole gnd" cx="216" cy="208" r="6"/>
    <text class="pinlbl" x="205" y="211" text-anchor="end">GND</text>
    <circle class="hole" cx="216" cy="229" r="6"/>
    <text class="pinlbl" x="205" y="232" text-anchor="end">GPIO7</text>
    <circle class="hole" cx="216" cy="250" r="6"/>
    <text class="pinlbl" x="205" y="253" text-anchor="end">GPIO6</text>
    <circle class="hole" cx="216" cy="271" r="6"/>
    <text class="pinlbl" x="205" y="274" text-anchor="end">GPIO5</text>
    <circle class="hole" cx="216" cy="292" r="6"/>
    <text class="pinlbl" x="205" y="295" text-anchor="end">GPIO4</text>
    <circle class="hole gnd" cx="216" cy="313" r="6"/>
    <text class="pinlbl" x="205" y="316" text-anchor="end">GND</text>
    <circle class="hole" cx="216" cy="334" r="6"/>
    <text class="pinlbl muted" x="205" y="337" text-anchor="end">GPIO18</text>
    <circle class="hole" cx="216" cy="355" r="6"/>
    <text class="pinlbl muted" x="205" y="358" text-anchor="end">GPIO19</text>
    <circle class="hole gnd" cx="216" cy="376" r="6"/>
    <text class="pinlbl" x="205" y="379" text-anchor="end">GND</text>
  </g>
</svg>
