<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 477" width="262" height="477" role="img" aria-label="ESP8266 NodeMCU top view (original drawing, CC0)">
  <title>ESP8266 NodeMCU top view (original drawing, CC0)</title>
  <!--
    Original CC0 top view for HelpmeSolder wiring diagrams.
    Black NodeMCU v1.0 (Amica) with a CP2102 USB bridge (CH340 on clones), ESP-12E module and antenna at the top, micro-USB with FLASH and RST at the bottom.
    Left header top to bottom: A0 RSV RSV SD3 SD2 SD1 CMD SD0 CLK GND 3V3 EN RST GND VIN.
    Right header top to bottom: D0 D1 D2 D3 D4 3V3 GND D5 D6 D7 D8 RX TX GND 3V3.
    Catalog GND is the left-header GND next to 3V3, catalog 3V is the left-header 3V3.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
