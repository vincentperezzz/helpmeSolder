<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 341 196" width="341" height="196" role="img" aria-label="Raspberry Pi Zero W top view (original drawing, CC0)">
  <title>Raspberry Pi Zero W top view (original drawing, CC0)</title>
  <!--
    Original CC0 top view for HelpmeSolder wiring diagrams.
    65 x 30 mm. 40-pin GPIO header along the top edge; microSD slot at the left end; mini-HDMI, the micro-USB data port and the PWR micro-USB
    on the bottom edge; CSI camera connector at the right end; BCM2835 beside the metal RF shield.
    Header: 40 pins in two rows of 20. Odd pins (1 = 3V3, square pad) on the row nearer the board centre, even pins (2 = 5V) on the outer row;
    pin 1 is at the left end next to the SD-card end. Labels are the BCM GPIO numbers. Catalog terminals: 3V3 = pin 1, 5V = pin 2, GND = pin 6.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .hole { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.2; }
      .gnd { fill: #212121; stroke: #000; }
      .pwr { fill: #c62828; stroke: #8e0000; }
      .v3 { fill: #ef6c00; stroke: #e65100; }
      .usb { fill: #cfd8dc; stroke: #546e7a; stroke-width: 1.2; }
      .metal { fill: #b0bec5; stroke: #607d8b; stroke-width: 1; }
      .btn { fill: #eceff1; stroke: #607d8b; stroke-width: 1; }
      .chip { fill: #1a1a1a; stroke: #000; stroke-width: 0.8; }
      .smd { fill: #d7ccc8; stroke: #6d4c41; stroke-width: 0.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #eceff1; }
      .pinlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #eceff1; }
      .muted { fill: #90a4ae; }
    ]]></style>
